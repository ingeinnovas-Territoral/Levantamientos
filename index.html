<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Levantamientos</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Levantamientos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F8F9F6">
<script src="three.min.js"></script>
<script src="jspdf.umd.min.js"></script>
<style>
/* Layout: mesa de dibujo — barra superior, lienzo de planta a la izquierda, inspector de campo a la derecha (abajo en pantallas angostas). */
:root{
  --paper:#EDF0EC; --panel:#F8F9F6; --panel2:#E6EAE5; --ink:#1B2328; --ink2:#56626A; --line:#C9D0CB;
  --grid:#DFE4DF; --grid2:#CFD6D0; --poche:#98A3A8; --room:#F7F8F4; --el:#E3E8E2; --elev:#E8ECE6;
  --dim:#1F5FBF; --accent:#D98200; --accentwash:rgba(217,130,0,.16); --danger:#B8392A; --ok:#2F7D4F; --roof:#8A5A2B;
  --f-ui:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --f-num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12171A; --panel:#192024; --panel2:#222A2F; --ink:#E4E9E6; --ink2:#9BA7AE; --line:#2F393F;
  --grid:#1A2125; --grid2:#253035; --poche:#5E6B73; --room:#161C1F; --el:#253036; --elev:#1E262A;
  --dim:#73A6F2; --accent:#F0A63A; --accentwash:rgba(240,166,58,.18); --danger:#E0705F; --ok:#6CC08C; --roof:#D49A62; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12171A; --panel:#192024; --panel2:#222A2F; --ink:#E4E9E6; --ink2:#9BA7AE; --line:#2F393F;
  --grid:#1A2125; --grid2:#253035; --poche:#5E6B73; --room:#161C1F; --el:#253036; --elev:#1E262A;
  --dim:#73A6F2; --accent:#F0A63A; --accentwash:rgba(240,166,58,.18); --danger:#E0705F; --ok:#6CC08C; --roof:#D49A62; color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}html{height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{height:100%;margin:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}input,textarea,select{-webkit-user-select:text;user-select:text}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
#app{height:100%;display:grid;grid-template-rows:auto 1fr}
.bar{display:flex;align-items:center;gap:12px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.projbtn{display:flex;flex-direction:column;align-items:flex-start;background:none;border:0;padding:2px 4px;cursor:pointer;min-width:0;max-width:260px;text-align:left}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.projbtn b{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tabs{display:flex;background:var(--panel2);border-radius:8px;padding:3px;gap:2px;margin-inline:auto}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:6px;cursor:pointer;font-weight:500;color:var(--ink2)}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.baract{display:flex;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap;min-height:38px}
.btn:hover{border-color:var(--ink2)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#1B1300}
.btn.on{background:var(--accentwash);border-color:var(--accent)}
.btn.dng{color:var(--danger)}
.btn.sm{padding:4px 9px;min-height:32px;font-size:14px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0}
#stage{position:relative;min-height:0;overflow:hidden;background:var(--paper)}
#cv,#cv3{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#cuadro{position:absolute;inset:0;overflow:auto;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
.tools{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 24px)}
.tools .btn{background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(6px)}
.tools select{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 8px;min-height:38px}
#hud{position:absolute;right:12px;top:10px;font:12px var(--f-num);color:var(--ink2);background:color-mix(in srgb,var(--panel) 85%,transparent);padding:3px 7px;border-radius:5px;pointer-events:none}
#msg3{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink2);padding:24px;text-align:center}
aside{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:14px 40px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.crumbs button{background:none;border:0;color:var(--dim);cursor:pointer;padding:2px 0;font-weight:500}
h2{font-size:21px;font-weight:700;margin:0;text-wrap:balance;line-height:1.15}
h3{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);margin:0;font-weight:600}
.sec{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld span{font-size:12px;color:var(--ink2)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:7px 8px;min-height:38px;width:100%;box-sizing:border-box;min-width:0}
.fld input[inputmode="decimal"]{font-family:var(--f-num)}
.fld textarea{min-height:64px;resize:vertical}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stats div{background:var(--panel);padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.stats small{font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.stats b{font:500 16px var(--f-num);font-variant-numeric:tabular-nums}
.warn{color:var(--danger);font-size:13px}
.okc{color:var(--ok);font-size:13px}
.trace{background:var(--panel2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.meas{display:flex;gap:8px;align-items:stretch}
.meas input{flex:1;min-width:0;font:500 28px var(--f-num);padding:6px 10px;border:2px solid var(--ink);border-radius:8px;background:var(--panel);text-align:right}
.meas select{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 6px}
.dirpad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,44px);gap:4px}
.dirpad button{border:1px solid var(--line);background:var(--panel);border-radius:7px;cursor:pointer;font-size:18px}
.dirpad button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dirpad .c{display:grid;place-items:center;font:500 13px var(--f-num);color:var(--ink2)}
.dirrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.dirside{display:flex;flex-direction:column;gap:6px;flex:1;min-width:120px}
.hint{font-size:12.5px;color:var(--ink2);line-height:1.4}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.list button.row{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;text-align:left;background:var(--panel);border:0;border-bottom:1px solid var(--line);padding:9px 10px;cursor:pointer}
.list button.row:last-child{border-bottom:0}
.list button.row:hover{background:var(--panel2)}
.list .code{font:500 13px var(--f-num);color:var(--dim)}
.list .num{font:13px var(--f-num);color:var(--ink2);font-variant-numeric:tabular-nums}
.opcard{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--paper)}
.opcard header{display:flex;justify-content:space-between;align-items:center}
.opcard .code{font:600 14px var(--f-num);color:var(--dim)}
.row-btns{display:flex;gap:6px;flex-wrap:wrap}
.elgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.elgrid button{text-align:left;font-size:14px}
.confirm{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px}
.overlay{position:fixed;inset:0;background:rgba(10,14,16,.45);display:flex;justify-content:flex-start;z-index:20}
.drawer{background:var(--panel);width:min(420px,100%);height:100%;overflow:auto;box-sizing:border-box;padding-block:max(18px,env(safe-area-inset-top,0px)) 30px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:14px}
.pop{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:58px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:12px;width:min(320px,calc(100vw - 24px));display:flex;flex-direction:column;gap:8px;z-index:15}
.pop .btn{text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.pop .btn small{font-weight:400;color:var(--ink2);font-size:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:8px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100vw - 32px)}
#toast.show{opacity:1}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:600;background:var(--panel2)}
td.n{font-family:var(--f-num);text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:600;border-top:2px solid var(--ink)}
.cuadro-in{max-width:1100px;display:flex;flex-direction:column;gap:22px}
.cuadro-in h2{font-size:24px}
.badge{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--accentwash);color:var(--ink)}
.sync{font-size:11.5px;color:var(--ink2);white-space:nowrap}
main.nopanel{grid-template-columns:minmax(0,1fr)}
main.nopanel aside{display:none}
.rail{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:10px;display:flex;flex-direction:column;gap:4px;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:5px;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.rail button{width:52px;height:50px;border:0;border-radius:9px;background:none;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-size:10.5px;letter-spacing:.02em}
.rail button svg{width:22px;height:22px}
.rail button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.rail hr{border:0;border-top:1px solid var(--line);margin:3px 4px;width:auto}
.elpal{position:absolute;left:calc(max(10px,env(safe-area-inset-left,0px)) + 72px);top:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;width:min(320px,calc(100% - 100px));z-index:6;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.elpal button{text-align:left;font-size:13.5px;padding:7px 9px;min-height:36px;border:1px solid var(--line);border-radius:7px;background:var(--paper);cursor:pointer}
.elpal button[aria-pressed="true"]{border-color:var(--accent);background:var(--accentwash)}
.elpal p{grid-column:1/-1;margin:2px 2px 4px;font-size:12px;color:var(--ink2)}
.chip{position:absolute;left:50%;transform:translateX(-50%);top:10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.12);max-width:calc(100% - 150px)}
.chip b{font-weight:600;white-space:nowrap}
.chip .num{font:13px var(--f-num);color:var(--ink2);white-space:nowrap}
.qedit{position:absolute;z-index:8;display:flex;gap:6px;align-items:center;background:var(--panel);border:2px solid var(--accent);border-radius:10px;padding:5px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.qedit input{width:96px;font:500 20px var(--f-num);border:1px solid var(--line);border-radius:7px;padding:4px 8px;background:var(--paper);text-align:right}
.qedit span{font:13px var(--f-num);color:var(--ink2)}
#hud{top:auto;bottom:60px}
@media (max-width:760px){
  .rail{flex-direction:row;flex-wrap:wrap;right:10px;max-width:calc(100% - 20px)}
  .rail button{width:46px;height:46px}
  .rail hr{display:none}
  .elpal{left:10px;top:120px}
  .chip{top:auto;bottom:62px;max-width:calc(100% - 20px)}
  body{overflow:auto}
  #app{height:auto;min-height:100%}
  main{grid-template-columns:1fr;grid-template-rows:58vh auto}
  aside{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .tabs{order:3;width:100%;margin:0}
  .tabs button{flex:1;padding:7px 4px}
  .sync{display:none}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <button class="projbtn" id="btnProj" aria-label="Abrir proyectos"><span class="eyebrow">Proyecto ▾</span><b id="projName">—</b></button>
    <nav class="tabs" role="tablist" aria-label="Vistas">
      <button role="tab" data-view="planta" aria-selected="true">Planta</button>
      <button role="tab" data-view="alzados" aria-selected="false">Alzados</button>
      <button role="tab" data-view="3d" aria-selected="false">3D</button>
      <button role="tab" data-view="cuadro" aria-selected="false">Cuadro</button>
    </nav>
    <div class="baract">
      <span class="sync" id="sync">Guardado en este iPad</span>
      <button class="btn" id="bPanel" aria-pressed="false">Datos</button>
      <button class="btn" id="bUndo" aria-label="Deshacer">↶</button>
      <button class="btn" id="bRedo" aria-label="Rehacer">↷</button>
      <button class="btn pri" id="bExp">Exportar</button>
    </div>
  </header>
  <main>
    <section id="stage">
      <canvas id="cv"></canvas>
      <canvas id="cv3" hidden></canvas>
      <div id="msg3" hidden></div>
      <div id="cuadro" hidden></div>
      <div class="rail" id="rail" role="toolbar" aria-label="Herramientas"></div>
      <div class="elpal" id="elpal" hidden></div>
      <div class="chip" id="chip" hidden></div>
      <div class="qedit" id="qedit" hidden><input id="qIn" inputmode="decimal" autocomplete="off" aria-label="Nueva medida"><span id="qUnit">m</span><button class="btn pri sm" id="qOk">OK</button></div>
      <div class="tools" id="tools">
        <button class="btn" id="tFit">Ajustar vista</button>
        <select id="tPiso" aria-label="Piso"></select>
        <button class="btn on" id="tDims" aria-pressed="true">Cotas de vanos</button>
        <button class="btn on" id="tRoof" aria-pressed="true">Cubiertas</button>
      </div>
      <div id="hud"></div>
    </section>
    <aside id="insp" aria-label="Inspector"></aside>
  </main>
</div>
<div class="overlay" id="drawer" hidden><div class="drawer" id="drawerIn"></div></div>
<div class="pop" id="pop" hidden></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<div id="toast" role="status"></div>

<script>
"use strict";
/* ============ utilidades ============ */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
const num=(v,d=0)=>{if(v==null)return d;const m=String(v).replace(/,/g,'.').match(/-?\d*\.?\d+/);return m?parseFloat(m[0]):d};
const f2=v=>(Math.round((v+Number.EPSILON)*100)/100).toFixed(2);
const fc=v=>f2(v).replace('.',',');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const add=(a,b)=>[a[0]+b[0],a[1]+b[1]], sub=(a,b)=>[a[0]-b[0],a[1]-b[1]], mul=(a,k)=>[a[0]*k,a[1]*k];
const len=a=>Math.hypot(a[0],a[1]), unit=a=>{const l=len(a)||1;return[a[0]/l,a[1]/l]}, perp=a=>[-a[1],a[0]];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const normA=a=>{while(a<0)a+=360;while(a>=360)a-=360;return Math.round(a*100)/100};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2600)}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}

/* ============ catálogo ============ */
const CAT={
  columna:{n:'Columna',w:.3,d:.3,h:2.6,z:0,fill:'col'},
  colcirc:{n:'Columna circular',w:.3,d:.3,h:2.6,z:0,fill:'col',circ:1},
  viga:{n:'Viga',w:3,d:.25,h:.3,z:2.3,dash:1},
  vigacanal:{n:'Viga canal',w:3,d:.4,h:.35,z:2.6,dash:1},
  escalera:{n:'Escalera',w:1,d:3,h:2.6,z:0,stairs:1},
  meson:{n:'Mesón',w:2,d:.6,h:.9,z:0},
  lavaplatos:{n:'Lavaplatos',w:.8,d:.5,h:.9,z:0,sym:'sink'},
  sanitario:{n:'Sanitario',w:.4,d:.7,h:.4,z:0,sym:'wc'},
  lavamanos:{n:'Lavamanos',w:.5,d:.4,h:.85,z:0,sym:'sink'},
  ducha:{n:'Ducha',w:.9,d:.9,h:0,z:0,sym:'shower'},
  lavadero:{n:'Lavadero',w:.6,d:.6,h:.9,z:0,sym:'sink'},
  tanque:{n:'Tanque',w:1,d:1,h:1.2,z:0,circ:1},
  tablero:{n:'Tablero eléctrico',w:.4,d:.12,h:.5,z:1.5},
  medidor:{n:'Contador / medidor',w:.3,d:.15,h:.4,z:1.2},
  rejilla:{n:'Rejilla / sifón',w:.15,d:.15,h:0,z:0,circ:1},
  caja:{n:'Caja de inspección',w:.6,d:.6,h:0,z:0},
  mueble:{n:'Otro elemento',w:1,d:.6,h:.9,z:0},
  patologia:{n:'Patología',w:.3,d:.3,h:0,z:1.2,marker:1},
};
const MATS=['Ladrillo','Bloque de concreto','Concreto','Bahareque','Tapia pisada','Drywall','Madera','Lámina','Otro'];
const ESTADOS=['Bueno','Regular','Malo'];
const PATS=['Humedad','Fisura','Grieta','Desprendimiento','Corrosión','Hundimiento','Filtración','Otro'];
const ROOFS=[['ninguna','Sin cubierta'],['plana','Losa / plana'],['una','Una agua'],['dos','Dos aguas']];

/* ============ estado ============ */
let store={projects:{},current:null};
let P=null, sel={t:'proj'};
const view={mode:'planta',cx:0,cy:0,scale:60,piso:1,dimOps:true,roofs:true,tool:'sel',elType:'columna',finger:false,panel:false,dimHits:[]};
let drawSid=null,live=null,frozenElev=null;
const trace={dir:0,auto:'left',unit:'m',t:0.15};
let undoS=[],redoS=[];

function newSpace(name,x,y,piso,npt){return{id:uid(),name,x,y,rot:0,piso:piso||1,npt:npt||0,h:2.6,pisoAcab:'',cielo:'',notas:'',closed:false,walls:[],roof:{type:'ninguna',hA:2.6,hC:3.4,vuelo:.5,dir:'S',mat:''}}}

function newOp(type){const d={puerta:{w:.9,h:2.1,sill:0},ventana:{w:1.2,h:1.2,sill:.9},vano:{w:.9,h:2.1,sill:0}}[type];return{id:uid(),type,off:.3,w:d.w,h:d.h,sill:d.sill,hinge:'ini',swing:'int',mat:'',nota:''}}
function newProject(name){return{id:uid(),name:name||'Proyecto nuevo',dir:'',mun:'',levanto:'',fecha:new Date().toISOString().slice(0,10),notas:'',spaces:[],elements:[],updated:Date.now()}}

/* ============ geometría ============ */
function wh(w,s,which){const v=which==='i'?w.hIni:w.hFin;return v==null||v===''?s.h:v}
function lineX(p,d,q,e){const den=d[0]*e[1]-d[1]*e[0];if(Math.abs(den)<1e-6)return null;const t=((q[0]-p[0])*e[1]-(q[1]-p[1])*e[0])/den;return add(p,mul(d,t))}
function geom(s){
  const W=s.walls,V=[[0,0]];
  W.forEach(w=>{const a=rad(w.ang),p=V[V.length-1];V.push([p[0]+w.len*Math.cos(a),p[1]+w.len*Math.sin(a)])});
  const n=W.length,closed=!!s.closed&&n>=3;
  const gap=n?len(V[n]):0;
  const Pp=closed?V.slice(0,n):V.slice();
  let A=0;for(let i=0;i<Pp.length;i++){const a=Pp[i],b=Pp[(i+1)%Pp.length];A+=a[0]*b[1]-b[0]*a[1]}A/=2;
  const ccw=A>=0;
  const segs=W.map((w,i)=>{const a=V[i],b=(closed&&i===n-1)?V[0]:V[i+1];const dv=sub(b,a);const L=len(dv)||1e-9;const d=[dv[0]/L,dv[1]/L];const nn=ccw?[d[1],-d[0]]:[-d[1],d[0]];
    return{w,i,a,b,d,n:nn,L,t:w.t||0.0001,oa:add(a,mul(nn,w.t||0)),ob:add(b,mul(nn,w.t||0))}});
  const joints=[];
  for(let k=0;k<segs.length;k++){
    const nx=k+1<segs.length?k+1:(closed?0:-1);if(nx<0)break;
    const A1=segs[k],B1=segs[nx];
    const pt=lineX(A1.oa,A1.d,B1.oa,B1.d);
    if(pt&&len(sub(pt,B1.a))<6*Math.max(A1.t,B1.t)+.05){A1.ob=pt;B1.oa=pt}
    joints.push({p:B1.a,prev:A1,cur:B1,m:B1.oa});
  }
  let cen;if(closed&&Math.abs(A)>1e-6){let cx=0,cy=0;for(let i=0;i<Pp.length;i++){const a=Pp[i],b=Pp[(i+1)%Pp.length],c=a[0]*b[1]-b[0]*a[1];cx+=(a[0]+b[0])*c;cy+=(a[1]+b[1])*c}cen=[cx/(6*A),cy/(6*A)]}
  else{cen=Pp.reduce((s,p)=>add(s,p),[0,0]);cen=mul(cen,1/(Pp.length||1))}
  const perim=segs.reduce((s,g)=>s+g.L,0);
  return{V,P:Pp,segs,joints,closed,gap,area:closed?Math.abs(A):0,ccw,perim,cen,end:V[n]};
}
function pieces(sg){
  const ops=sg.w.openings.map(o=>[clamp(o.off,0,sg.L),clamp(o.off+o.w,0,sg.L)]).sort((a,b)=>a[0]-b[0]);
  const out=[];let c=0;
  const P=s=>add(sg.a,mul(sg.d,s)),O=s=>s<=1e-6?sg.oa:(s>=sg.L-1e-6?sg.ob:add(add(sg.a,mul(sg.n,sg.t)),mul(sg.d,s)));
  const push=(s0,s1)=>{if(s1-s0>.001)out.push([P(s0),P(s1),O(s1),O(s0)])};
  ops.forEach(([s0,s1])=>{push(c,s0);c=Math.max(c,s1)});push(c,sg.L);return out;
}
const toW=(s,p)=>{const r=rad(s.rot||0),c=Math.cos(r),si=Math.sin(r);return[s.x+p[0]*c-p[1]*si,s.y+p[0]*si+p[1]*c]};
const rotV=(s,v)=>{const r=rad(s.rot||0),c=Math.cos(r),si=Math.sin(r);return[v[0]*c-v[1]*si,v[0]*si+v[1]*c]};
const toL=(s,p)=>{const r=-rad(s.rot||0),c=Math.cos(r),si=Math.sin(r),x=p[0]-s.x,y=p[1]-s.y;return[x*c-y*si,x*si+y*c]};
function inPoly(pt,poly){let ins=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if(((a[1]>pt[1])!==(b[1]>pt[1]))&&(pt[0]<(b[0]-a[0])*(pt[1]-a[1])/(b[1]-a[1])+a[0]))ins=!ins}return ins}
function elCorners(e){const c=Math.cos(rad(e.rot||0)),s=Math.sin(rad(e.rot||0)),hw=e.w/2,hd=e.d/2;return[[-hw,-hd],[hw,-hd],[hw,hd],[-hw,hd]].map(([x,y])=>[e.x+x*c-y*s,e.y+x*s+y*c])}
function elLocal(e,x,y){const c=Math.cos(rad(e.rot||0)),s=Math.sin(rad(e.rot||0));return[e.x+x*c-y*s,e.y+x*s+y*c]}
function opCodes(){const m={},c={puerta:0,ventana:0,vano:0},pre={puerta:'P',ventana:'V',vano:'VN'};
  P.spaces.forEach(s=>s.walls.forEach(w=>w.openings.forEach(o=>{c[o.type]++;m[o.id]=pre[o.type]+c[o.type]})));return m}
function patNums(){const m={};let i=0;P.elements.forEach(e=>{if(e.type==='patologia')m[e.id]=++i});return m}
function roofBox(s,g){let xs=[],ys=[];g.segs.forEach(sg=>[sg.a,sg.b,sg.oa,sg.ob].forEach(p=>{xs.push(p[0]);ys.push(p[1])}));if(!xs.length)return null;const v=s.roof.vuelo||0;return[Math.min(...xs)-v,Math.min(...ys)-v,Math.max(...xs)+v,Math.max(...ys)+v]}

/* ============ listas de dibujo (modelo en metros, y hacia arriba) ============ */
const L_=(a,b,st,ly)=>({k:'line',a,b,st,ly});
function txt(dl,p,s,mm,o={}){dl.push(Object.assign({k:'text',p,s,mm,ang:0,al:'c',st:'ink',ly:'TEXTOS',dy:0},o))}
function dimDL(dl,a,b,off,t,o={}){
  const u=unit(sub(b,a)),on=unit(off),a2=add(a,off),b2=add(b,off),ly=o.ly||'COTAS',st='dim';
  dl.push(L_(add(a,mul(on,.05)),add(a2,mul(on,.08)),st,ly),L_(add(b,mul(on,.05)),add(b2,mul(on,.08)),st,ly),L_(a2,b2,st,ly));
  const tv=mul(unit(add(u,perp(u))),.07);
  dl.push(L_(sub(a2,tv),add(a2,tv),st,ly),L_(sub(b2,tv),add(b2,tv),st,ly));
  let ang=Math.atan2(u[1],u[0]);if(ang>Math.PI/2+1e-6||ang<=-Math.PI/2+1e-6)ang+=Math.PI;
  txt(dl,mul(add(a2,b2),.5),t,o.mm||2.1,{ang,st:'dim',ly,dy:.7,font:'num'});
}
function arcDL(dl,c,r,v1,v2,st,ly){let a1=Math.atan2(v1[1],v1[0]),a2=Math.atan2(v2[1],v2[0]);let dd=a2-a1;while(dd<=-Math.PI)dd+=2*Math.PI;while(dd>Math.PI)dd-=2*Math.PI;if(dd<0){const t=a1;a1=a2;a2=t}if(a2<a1)a2+=2*Math.PI;dl.push({k:'arc',c,r,a0:a1,a1:a2,st,ly})}

function planDL(piso,opt={}){
  if(opt.roofPlan){const dl=[];wallsOutlineDL(dl,piso);roofsDL(dl,piso,opt);return dl}
  const dl=[],codes=opCodes(),pn=patNums(),interactive=!opt.print;
  const S=P.spaces.filter(s=>s.piso===piso);if(interactive)view.dimHits=[];
  S.forEach(s=>{const g=geom(s),T=p=>toW(s,p),R=v=>rotV(s,v);
    const sSel=interactive&&(sel.sid===s.id);
    if(g.closed)dl.push({k:'poly',pts:g.P.map(T),closed:1,fill:sSel&&sel.t==='space'?'selfill':'room',st:null,ly:'ESPACIOS'});
  });
  S.forEach(s=>{const g=geom(s),T=p=>toW(s,p),R=v=>rotV(s,v);
    g.segs.forEach(sg=>{const wSel=interactive&&sel.t==='wall'&&sel.wid===sg.w.id;
      pieces(sg).forEach(q=>dl.push({k:'poly',pts:q.map(T),closed:1,fill:'wall',st:wSel?'sel':'ink',ly:'MUROS'}));
      sg.w.openings.forEach(o=>opPlan(dl,sg,o,T,codes[o.id],wSel));
      if(sg.L>.05){dimDL(dl,T(sg.a),T(sg.b),R(mul(sg.n,-.42)),f2(sg.L));if(interactive&&!(g.closed&&sg.i===s.walls.length-1))view.dimHits.push({p:T(add(mul(add(sg.a,sg.b),.5),mul(sg.n,-.42))),sid:s.id,wid:sg.w.id,v:sg.w.len})}
      if(view.dimOps||opt.print)sg.w.openings.forEach(o=>{const s0=clamp(o.off,0,sg.L),s1=clamp(o.off+o.w,0,sg.L);if(s1-s0<.02)return;
        dimDL(dl,T(add(sg.a,mul(sg.d,s0))),T(add(sg.a,mul(sg.d,s1))),R(mul(sg.n,sg.t+.32)),f2(s1-s0),{mm:1.8});
        if(s0>.02)dimDL(dl,T(sg.a),T(add(sg.a,mul(sg.d,s0))),R(mul(sg.n,sg.t+.32)),f2(s0),{mm:1.8});
        if(sg.L-s1>.02)dimDL(dl,T(add(sg.a,mul(sg.d,s1))),T(sg.b),R(mul(sg.n,sg.t+.32)),f2(sg.L-s1),{mm:1.8});
      });
    });
    const c=T(g.cen);
    txt(dl,c,s.name,3.1,{bold:1,dy:2.6});
    if(g.closed)txt(dl,c,'A = '+f2(g.area)+' m²',2.2,{dy:-1.4,font:'num'});
    txt(dl,c,'h '+f2(s.h)+' · NPT '+(s.npt>=0?'+':'')+f2(s.npt),2,{dy:-4.6,font:'num',st:'ink2'});
    if(interactive&&view.tool==='sel'&&sel.sid===s.id&&(sel.t==='space'||sel.t==='wall')&&!g.closed&&s.walls.length){const e=T(g.end),d=rotV(s,[Math.cos(rad(trace.dir)),Math.sin(rad(trace.dir))]);dl.push({k:'line',a:e,b:add(e,mul(d,1)),st:'ghost',ly:'X'});dl.push({k:'circle',c:e,r:.08,st:'sel',ly:'X'})}
  });
  P.elements.filter(e=>(e.piso||1)===piso).forEach(e=>elPlan(dl,e,interactive&&sel.t==='el'&&sel.eid===e.id,pn[e.id]));
  roofsDL(dl,piso,opt);
  return dl;
}
function opPlan(dl,sg,o,T,code,wSel){
  const s0=clamp(o.off,0,sg.L),s1=clamp(o.off+o.w,0,sg.L);if(s1-s0<.01)return;
  const A=add(sg.a,mul(sg.d,s0)),B=add(sg.a,mul(sg.d,s1)),nt=mul(sg.n,sg.t),Ao=add(A,nt),Bo=add(B,nt),ly='VANOS';
  dl.push(L_(T(A),T(Ao),'ink',ly),L_(T(B),T(Bo),'ink',ly));
  if(o.type==='ventana'){dl.push(L_(T(A),T(B),'thin',ly),L_(T(add(A,mul(nt,.5))),T(add(B,mul(nt,.5))),'thin',ly),L_(T(Ao),T(Bo),'thin',ly))}
  else if(o.type==='vano'){dl.push(L_(T(A),T(B),'dash',ly),L_(T(Ao),T(Bo),'dash',ly))}
  else{const ext=o.swing==='ext',hingeEnd=o.hinge==='fin';
    let H=hingeEnd?B:A;const other=hingeEnd?A:B;if(ext)H=add(H,nt);
    const side=ext?unit(sg.n):mul(unit(sg.n),-1),w=s1-s0;const leaf=add(H,mul(side,w));
    dl.push(L_(T(H),T(leaf),'ink',ly));
    const toOther=unit(sub(other,hingeEnd?B:A));
    const Hw=T(H);arcDL(dl,Hw,w,sub(T(add(H,mul(toOther,w))),Hw),sub(T(leaf),Hw),'thin',ly);
  }
  const m=T(add(add(A,B).map(v=>v/2),mul(sg.n,-.22)));
  txt(dl,m,code||'',1.8,{st:'dim',font:'num',ly,dy:-.6});
}
function elPlan(dl,e,isSel,pnum){
  const c=CAT[e.type]||CAT.mueble,ly='ELEMENTOS',st=isSel?'sel':'thin';
  if(c.marker){dl.push({k:'circle',c:[e.x,e.y],r:.2,st:isSel?'sel':'pat',ly:'PATOLOGIAS',fill:'patfill'});txt(dl,[e.x,e.y],String(pnum||''),2,{st:'pat',bold:1,dy:-.7,ly:'PATOLOGIAS'});return}
  if(c.circ){dl.push({k:'circle',c:[e.x,e.y],r:e.w/2,st,ly,fill:c.fill==='col'?'col':'el'})}
  else dl.push({k:'poly',pts:elCorners(e),closed:1,fill:c.fill==='col'?'col':(c.dash?null:'el'),st:c.dash?(isSel?'sel':'dash'):st,ly});
  const Lp=(x,y)=>elLocal(e,x,y);
  if(c.stairs){const n=Math.max(2,Math.round(e.d/.28));for(let i=1;i<n;i++){const y=-e.d/2+i*e.d/n;dl.push(L_(Lp(-e.w/2,y),Lp(e.w/2,y),'thin',ly))}
    dl.push(L_(Lp(0,-e.d/2+.1),Lp(0,e.d/2-.15),'ink',ly),L_(Lp(0,e.d/2-.15),Lp(-.12,e.d/2-.35),'ink',ly),L_(Lp(0,e.d/2-.15),Lp(.12,e.d/2-.35),'ink',ly));txt(dl,Lp(0,-e.d/2+.12),'SUBE',1.6,{st:'ink2',dy:.4})}
  if(c.sym==='wc'){const pts=[];for(let i=0;i<=24;i++){const a=i/24*Math.PI*2;pts.push(Lp(Math.cos(a)*e.w*.42,-e.d*.12+Math.sin(a)*e.d*.33))}dl.push({k:'poly',pts,closed:1,st:'thin',ly,fill:null});dl.push(L_(Lp(-e.w/2,e.d/2-.18),Lp(e.w/2,e.d/2-.18),'thin',ly))}
  if(c.sym==='sink'){const pts=[];for(let i=0;i<=24;i++){const a=i/24*Math.PI*2;pts.push(Lp(Math.cos(a)*e.w*.32,Math.sin(a)*e.d*.3))}dl.push({k:'poly',pts,closed:1,st:'thin',ly,fill:null})}
  if(c.sym==='shower'){dl.push(L_(Lp(-e.w/2,-e.d/2),Lp(e.w/2,e.d/2),'thin',ly),L_(Lp(-e.w/2,e.d/2),Lp(e.w/2,-e.d/2),'thin',ly))}
  if(!c.sym&&!c.stairs&&c.fill!=='col'&&(e.w>.5||e.d>.5))txt(dl,[e.x,e.y],c.n,1.7,{st:'ink2',dy:-.6,ang:(e.w<e.d?rad((e.rot||0)+90):rad(e.rot||0))});
}

function elevDL(s,rowW,frz){
  const g=geom(s),dl=[],blocks=[],codes=opCodes(),pos={};let x=0,y=0,rowH=0;
  g.segs.forEach((sg,i)=>{const w=sg.w,L=sg.L,mir=g.ccw;
    let h0=wh(w,s,'i'),h1=wh(w,s,'f');if(mir){const t=h0;h0=h1;h1=t}
    const mh=Math.max(h0,h1),bw=L+2.2,bh=mh+2.4;
    if(x>0&&x+bw>rowW){x=0;y-=rowH;rowH=0}
    let ox=x+1.1,oy=y-bh+1.4;if(frz&&frz[w.id]){ox=frz[w.id][0];oy=frz[w.id][1]}pos[w.id]=[ox,oy];const U=u=>mir?L-u:u,Pt=(u,v)=>[ox+u,oy+v];
    const wSel=sel.t==='wall'&&sel.wid===w.id;
    dl.push(L_(Pt(-.4,0),Pt(L+.4,0),'ink',"ALZADOS"));
    dl.push({k:'poly',pts:[Pt(0,0),Pt(L,0),Pt(L,h1),Pt(0,h0)],closed:1,fill:'elev',st:wSel?'sel':'ink',ly:'ALZADOS'});
    const chain=[0,L];
    w.openings.forEach(o=>{let u0=clamp(o.off,0,L),u1=clamp(o.off+o.w,0,L);const a=Math.min(U(u0),U(u1)),b=Math.max(U(u0),U(u1));if(b-a<.01)return;
      const v0=clamp(o.sill,0,mh),v1=clamp(o.sill+o.h,0,mh);chain.push(a,b);blocks.push({k:'op',sid:s.id,wid:w.id,oid:o.id,ox,oy,a,b,v0,v1,mir,L});
      const oSel=sel.t==='op'&&sel.oid===o.id;if(oSel)dl.push({k:'poly',pts:[Pt(a,v0),Pt(b,v0),Pt(b,v1),Pt(a,v1)],closed:1,fill:'selfill',st:'sel',ly:'X'});
      dl.push({k:'poly',pts:[Pt(a,v0),Pt(b,v0),Pt(b,v1),Pt(a,v1)],closed:1,fill:'bg',st:'ink',ly:'ALZADOS'});
      if(o.type==='puerta'){const hingeLeft=(o.hinge==='fin')===mir;const hx=hingeLeft?a:b,fx=hingeLeft?b:a;dl.push(L_(Pt(fx,v0),Pt(hx,(v0+v1)/2),'dash','ALZADOS'),L_(Pt(fx,v1),Pt(hx,(v0+v1)/2),'dash','ALZADOS'))}
      else if(o.type==='ventana'){dl.push(L_(Pt((a+b)/2,v0),Pt((a+b)/2,v1),'thin','ALZADOS'),L_(Pt(a,(v0+v1)/2),Pt(b,(v0+v1)/2),'thin','ALZADOS'))}
      txt(dl,Pt((a+b)/2,v1),codes[o.id]||'',1.8,{st:'dim',font:'num',dy:-3.2});
      const dx=b+.2;if(v0>.02)dimDL(dl,Pt(dx,0),Pt(dx,v0),[.0001,0],f2(v0),{mm:1.7,ly:'COTAS'});
      dimDL(dl,Pt(dx,v0),Pt(dx,v1),[.0001,0],f2(v1-v0),{mm:1.7,ly:'COTAS'});
    });
    const ch=[...new Set(chain.map(v=>Math.round(v*1000)/1000))].sort((a,b)=>a-b);
    for(let k=0;k<ch.length-1;k++)if(ch[k+1]-ch[k]>.01)dimDL(dl,Pt(ch[k],0),Pt(ch[k+1],0),[0,-.38],f2(ch[k+1]-ch[k]),{mm:1.8});
    if(ch.length>2)dimDL(dl,Pt(0,0),Pt(L,0),[0,-.78],f2(L));
    dimDL(dl,Pt(0,0),Pt(0,h0),[-.4,0],f2(h0));

const SNAPPX=14;

    if(sel.t==='el'&&view.tool==='sel'){const e=curEl();if(e&&!(CAT[e.type]||{}).marker){const a=tf(e.x,e.y),b=tf(...elLocal(e,0,e.d/2+Math.max(.25,26/view.scale)));c.strokeStyle=COL.accent;c.lineWidth=1.5;c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke()}}
    handles().forEach(h=>dot(h.p,h.k==='rot'?8:7,h.k==='rot'?COL.accent:COL.panel,COL.accent));
    const sgp=drag&&drag.kind==='muro'&&drag.prev?{A:drag.A,sg:drag.prev}:hover;
    if(sgp){const a=tf(...sgp.A),b=tf(...sgp.sg.B);c.strokeStyle=COL.accent;c.lineWidth=Math.max(3,trace.t*view.scale);c.globalAlpha=.55;c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke();c.globalAlpha=1;
      if(sgp.sg.guide){const g0=tf(...sgp.sg.guide.from);c.setLineDash([5,5]);c.lineWidth=1;c.beginPath();c.moveTo(g0[0],g0[1]);c.lineTo(b[0],b[1]);c.stroke();c.setLineDash([])}
      dot(sgp.A,5,COL.accent,COL.accent);dot(sgp.sg.B,6,COL.panel,COL.accent);if(!live&&hover)label(sgp.sg.B,f2(sgp.sg.L)+' m')}
    const cs=chainSpace();if(cs&&view.tool==='muro'&&cs.walls.length){dot(toW(cs,geom(cs).end),6,COL.accent,COL.accent);dot(toW(cs,[0,0]),6,COL.panel,COL.ok||COL.accent)}
  }
  if(drag&&drag.kind==='newroof'&&drag.B){const a=tf(...drag.A),b=tf(...drag.B);c.setLineDash([7,5]);c.strokeStyle=COL.accent;c.lineWidth=2;c.strokeRect(Math.min(a[0],b[0]),Math.min(a[1],b[1]),Math.abs(b[0]-a[0]),Math.abs(b[1]-a[1]));c.setLineDash([]);c.fillStyle=COL.accentwash;c.fillRect(Math.min(a[0],b[0]),Math.min(a[1],b[1]),Math.abs(b[0]-a[0]),Math.abs(b[1]-a[1]))}
  if(sel.t==='roof'&&view.tool==='sel'){const r=curRoof();if(r){const a=tf(...elLocal(r,0,r.d/2)),b=tf(...elLocal(r,0,r.d/2+Math.max(.4,30/view.scale)));c.strokeStyle=COL.accent;c.lineWidth=1.5;c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke()}}

$('#chip').addEventListener('keydown',e=>{if(e.target.id==='sRenIn'){if(e.key==='Enter'){e.preventDefault();saveSpaceName()}if(e.key==='Escape'){chipRen=false;renderChip()}}});
$('#chip').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;const c=b.dataset.c;
  if(c==='more'){setPanel(true);return}
  if(c==='rpend'){const r=curRoof(),bb=b.getBoundingClientRect();openQ({v:r.pend,unit:'%',apply:v=>{r.pend=Math.round(v*10)/10}},bb.left+bb.width/2,bb.bottom+60);return}
  if(c==='rcover'){act('roofSpace');return}
  if(c==='sren'){chipRen=true;renderChip();setTimeout(()=>{const i=$('#sRenIn');if(i){i.focus();i.select()}},30);return}
  if(c==='srencancel'){chipRen=false;renderChip();return}
  if(c==='srenok'){saveSpaceName();return}
  if(c==='end'){endChain();renderAll();return}
  if(c==='cont'){drawSid=sel.sid;setTool('muro');return}
  if(c==='close'){const s=chainSpace();if(s){drawSid=null;sel={t:'space',sid:s.id};act('close');}return}
  if(c==='undowall'){const s=chainSpace();if(s&&s.walls.length){pushUndo();s.walls.pop();if(!s.walls.length){P.spaces=P.spaces.filter(x=>x!==s);drawSid=null;sel={t:'proj'}}saved();renderAll()}return}
  if(c==='len'){const s=curSpace(),w=curWall(),i=s.walls.indexOf(w);const r=b.getBoundingClientRect();openQ({sid:s.id,wid:w.id,v:w.len},r.left,r.bottom+40);return}
  pushUndo();
  if(sel.t==='el'){const e=curEl();if(c==='rot90')e.rot=normA((e.rot||0)+90);if(c==='dup'){const n={...e,id:uid(),x:r2(e.x+Math.max(e.w,.3)+.1)};P.elements.push(n);sel={t:'el',eid:n.id}}if(c==='del'){P.elements=P.elements.filter(x=>x!==e);sel={t:'proj'};toast('Eliminado. ↶ para deshacer')}}
  else if(sel.t==='op'){const w=curWall(),o=curOp();if(c==='hinge')o.hinge=o.hinge==='fin'?'ini':'fin';if(c==='swing')o.swing=o.swing==='ext'?'int':'ext';if(c==='del'){w.openings=w.openings.filter(x=>x!==o);sel={t:'wall',sid:sel.sid,wid:sel.wid};toast('Eliminado. ↶ para deshacer')}}
  else if(sel.t==='wall'&&c==='del'){const s=curSpace();s.walls=s.walls.filter(w=>w.id!==sel.wid);if(s.walls.length<3)s.closed=false;sel={t:'space',sid:s.id};toast('Muro eliminado. ↶ para deshacer')}
  else if(sel.t==='roof'){const r=curRoof();if(c==='rt')r.tipo=b.dataset.v;if(c==='rdir'){if(r.tipo==='dos')r.dir=r.dir==='x'?'y':'x';else r.cae={S:'O',O:'N',N:'E',E:'S'}[r.cae]||'S'}if(c==='del'){P.roofs=P.roofs.filter(x=>x!==r);sel={t:'proj'};toast('Cubierta eliminada. ↶ para deshacer')}}
  else if(sel.t==='space'&&c==='del'){const s=curSpace();P.spaces=P.spaces.filter(x=>x!==s);sel={t:'proj'};toast('Espacio eliminado. ↶ para deshacer')}
  saved();renderAll();
});

/* ---- editar medida tocando la cota ---- */
let qTarget=null;
function openQ(h,x,y){const st=$('#stage').getBoundingClientRect(),q=$('#qedit');qTarget=h;$('#qIn').value=f2(h.v);$('#qUnit').textContent=h.unit||'m';q.hidden=false;
  const qw=q.offsetWidth||190;q.style.left=clamp(x-st.left-qw/2,8,st.width-qw-8)+'px';q.style.top=clamp(y-st.top-70,8,st.height-60)+'px';setTimeout(()=>{$('#qIn').focus();$('#qIn').select()},20)}
function hideQ(){const q=$('#qedit');if(q)q.hidden=true;qTarget=null}
function applyQ(){if(!qTarget)return;const raw=$('#qIn').value;let v=num(raw,NaN);if(isNaN(v)||v<0||(v===0&&!qTarget.apply)){toast('Escribe la medida, por ejemplo 3.45');return}
  if(qTarget.apply){pushUndo();qTarget.apply(v);saved();hideQ();renderAll();return}
  if(/mm/i.test(raw))v/=1000;else if(/cm/i.test(raw))v/=100;
  const s=P.spaces.find(z=>z.id===qTarget.sid),w=s&&s.walls.find(z=>z.id===qTarget.wid);if(!w){hideQ();return}
  pushUndo();const i=s.walls.indexOf(w),g0=geom(s);
  if(g0.closed&&i<s.walls.length-1){const V=vertsOf(s),dlt=v-g0.segs[i].L,d=g0.segs[i].d;for(let k=i+1;k<V.length;k++)V[k]=add(V[k],mul(d,dlt));setVerts(s,frameOf(s),V)}
  else w.len=Math.round(v*1000)/1000;
  sel={t:'wall',sid:s.id,wid:w.id};saved();hideQ();renderAll();
  const g=geom(s);if(g.closed&&g.gap>.005)toast('El cierre se ajusta solo: error '+fc(g.gap*100)+' cm')}
$('#qOk').onclick=applyQ;$('#qIn').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();applyQ()}if(e.key==='Escape')hideQ()});

$('#bPanel').onclick=()=>setPanel(!view.panel);
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;

  const km={v:'sel',m:'muro',p:'puerta',w:'ventana',e:'el',c:'cub'};if(!e.metaKey&&!e.ctrlKey&&km[e.key])setTool(km[e.key]);
  if((e.key==='Delete'||e.key==='Backspace')&&sel.t==='roof'){pushUndo();P.roofs=P.roofs.filter(x=>x.id!==sel.rid);sel={t:'proj'};saved();renderAll()}
  if((e.key==='Delete'||e.key==='Backspace')&&sel.t==='el'){pushUndo();P.elements=P.elements.filter(x=>x.id!==sel.eid);sel={t:'proj'};saved();renderAll()}});

{const pp=lsGet('lev.panel');setPanel(pp==null?window.innerWidth>=1300:pp==='1')}

/* ============ guardado ============ */
let DB=null,remoteQ=new Set(),remoteT=null,remoteBusy=false;
function saveLocal(){lsSet('lev.projects',JSON.stringify(store.projects));lsSet('lev.current',store.current||'')}
function saved(){P.updated=Date.now();store.projects[P.id]=P;saveLocal();queueRemote(P.id)}
function queueRemote(id){if(!DB)return;remoteQ.add(id);clearTimeout(remoteT);remoteT=setTimeout(flushRemote,1500);setSync('Guardando…')}
async function flushRemote(){if(!DB||remoteBusy)return;remoteBusy=true;try{for(const id of [...remoteQ]){remoteQ.delete(id);const p=store.projects[id];const ref=DB.db.doc(DB.col+'/'+id);if(!p){await ref.delete();continue}await ref.set({name:p.name,updated:p.updated,json:JSON.stringify(p)})}setSync('Guardado en tu cuenta')}catch(e){setSync('Guardado en este dispositivo');console.warn(e)}remoteBusy=false;if(remoteQ.size)flushRemote()}
function setSync(t){$('#sync').textContent=t}
async function initDB(){
  if(!window.claude||!window.claude.use)return;
  try{const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!user)return;const id=await user.id();if(!id)return;
    DB={db,col:'data/users/'+id};const snap=await db.collection(DB.col).get();let changedLocal=false;
    snap.docs.forEach(d=>{const v=d.data();if(!v||!v.json)return;try{const p=JSON.parse(v.json);const loc=store.projects[p.id];if(!loc||(p.updated||0)>(loc.updated||0)){store.projects[p.id]=p;changedLocal=true}}catch(e){}});
    const remoteIds=new Set(snap.docs.map(d=>d.id));Object.values(store.projects).forEach(p=>{const r=snap.docs.find(d=>d.id===p.id);const ru=r&&r.data()?r.data().updated:0;if(!remoteIds.has(p.id)||(p.updated||0)>ru)remoteQ.add(p.id)});
    saveLocal();if(remoteQ.size)flushRemote();else setSync('Guardado en tu cuenta');
    if(changedLocal&&store.projects[P.id]&&store.projects[P.id]!==P){P=store.projects[P.id];renderAll()}
    if(changedLocal)renderDrawerIfOpen();
  }catch(e){console.warn(e)}
}
function pushUndo(){undoS.push(JSON.stringify(P));if(undoS.length>60)undoS.shift();redoS=[]}
function changed(){saved();renderAll()}
function doUndo(){if(!undoS.length)return;redoS.push(JSON.stringify(P));P=JSON.parse(undoS.pop());fixSel();saved();renderAll()}
function doRedo(){if(!redoS.length)return;undoS.push(JSON.stringify(P));P=JSON.parse(redoS.pop());fixSel();saved();renderAll()}
function fixSel(){if(sel.sid&&!curSpace())sel={t:'proj'};else if(sel.t==='wall'&&!curWall())sel={t:'space',sid:sel.sid};if(sel.t==='el'&&!curEl())sel={t:'proj'};if(sel.t==='op'&&!curOp())sel={t:'proj'};if(sel.t==='roof'&&!curRoof())sel={t:'proj'}}

/* ============ inspector ============ */
const insp=$('#insp');
const F=(label,o,k,val,t='num',x='')=>`<label class="fld"><span>${label}</span><input id="f-${o.replace(/[^a-z0-9]/gi,'')}-${k}" data-o="${o}" data-k="${k}" data-t="${t}" value="${esc(val==null?'':(t==='num'&&typeof val==='number'?f2(val):val))}" ${t==='num'?'inputmode="decimal" autocomplete="off"':''} ${x}></label>`;
const SL=(label,o,k,val,opts)=>`<label class="fld"><span>${label}</span><select id="f-${o.replace(/[^a-z0-9]/gi,'')}-${k}" data-o="${o}" data-k="${k}" data-t="sel">${opts.map(x=>{const v=Array.isArray(x)?x[0]:x,l=Array.isArray(x)?x[1]:x;return`<option value="${esc(v)}" ${String(v)===String(val)?'selected':''}>${esc(l)}</option>`}).join('')}</select></label>`;
const TA=(label,o,k,val)=>`<label class="fld"><span>${label}</span><textarea id="f-${o.replace(/[^a-z0-9]/gi,'')}-${k}" data-o="${o}" data-k="${k}" data-t="text">${esc(val)}</textarea></label>`;
function crumbs(){const s=curSpace();let h=`<div class="crumbs"><button data-a="goProj">${esc(P.name)}</button>`;if(s){h+=` / <button data-a="selSpace" data-v="${s.id}">${esc(s.name)}</button>`}if(sel.t==='wall'){const w=curWall();h+=` / <span>M${s.walls.indexOf(w)+1}</span>`}if(sel.t==='el'){h+=` / <span>Elemento</span>`}return h+'</div>'}
function renderInspector(){
  if(sel.t==='space'&&curSpace())insp.innerHTML=crumbs()+inspSpace();
  else if((sel.t==='wall'||sel.t==='op')&&curWall())insp.innerHTML=crumbs()+inspWall();
  else if(sel.t==='el'&&curEl())insp.innerHTML=crumbs()+inspEl();
  else if(sel.t==='roof'&&curRoof())insp.innerHTML=`<div class="crumbs"><button data-a="goProj">${esc(P.name)}</button> / <span>Cubierta</span></div>`+inspRoof();
  else{sel={t:'proj'};insp.innerHTML=inspProj()}
}
function inspProj(){
  const tot=P.spaces.reduce((a,s)=>a+geom(s).area,0);
  return `<div><span class="eyebrow">Proyecto</span>${P.example?' <span class="badge">Ejemplo</span>':''}<h2>${esc(P.name)}</h2></div>
  <div class="stats"><div><small>Espacios</small><b>${P.spaces.length}</b></div><div><small>Área interior</small><b>${f2(tot)}</b></div><div><small>Elementos</small><b>${P.elements.length}</b></div></div>
  <div class="sec"><h3>Espacios</h3>
  ${P.spaces.length?`<div class="list">${P.spaces.map(s=>{const g=geom(s);return`<button class="row" data-a="selSpace" data-v="${s.id}"><span class="code">P${s.piso}</span><span>${esc(s.name)}</span><span class="num">${g.closed?f2(g.area)+' m²':s.walls.length+' muros'}</span></button>`}).join('')}</div>`:'<p class="hint">Aún no hay espacios. Crea el primero y empieza a medir sus muros.</p>'}
  <button class="btn acc" data-a="addSpace">+ Nuevo espacio</button></div>
  <div class="sec"><h3>Agregar elemento en piso ${view.piso}</h3>${elButtons()}</div>
  <div class="sec"><h3>Datos del levantamiento</h3>
  ${F('Nombre del proyecto','proj','name',P.name,'text')}
  ${F('Dirección','proj','dir',P.dir,'text')}
  <div class="grid2">${F('Municipio','proj','mun',P.mun,'text')}${F('Fecha','proj','fecha',P.fecha,'text','type="date"')}</div>
  ${F('Levantó','proj','levanto',P.levanto,'text')}
  ${TA('Observaciones generales','proj','notas',P.notas)}</div>`;
}
function elButtons(){return `<div class="elgrid">${Object.entries(CAT).map(([k,c])=>`<button class="btn sm" data-a="addEl" data-v="${k}">${esc(c.n)}</button>`).join('')}</div>`}
function inspSpace(){
  const s=curSpace(),g=geom(s);
  const gapTxt=s.walls.length>=3?(g.closed?(g.gap>.005?`<span class="warn">Error de cierre: ${fc(g.gap*100)} cm</span>`:`<span class="okc">Espacio cerrado ✓</span>`):`<span class="hint">Distancia al punto inicial: ${f2(g.gap)} m</span>`):'';
  const D=[['↖',135],['↑',90],['↗',45],['←',180],null,['→',0],['↙',225],['↓',270],['↘',315]];
  return `<div><span class="eyebrow">Espacio · piso ${s.piso}</span><h2>${esc(s.name)}</h2></div>
  <div class="stats"><div><small>Área</small><b>${g.closed?f2(g.area):'—'}</b></div><div><small>Perímetro</small><b>${f2(g.perim)}</b></div><div><small>Volumen</small><b>${g.closed?f2(g.area*s.h):'—'}</b></div></div>
  ${gapTxt}
  ${s.closed?`<div class="row-btns"><button class="btn" data-a="reopen">Reabrir para seguir midiendo</button></div>`:`
  <div class="trace">
    <h3>Medir muros</h3>
    <div class="dirrow"><div class="dirpad" role="group" aria-label="Dirección del muro">${D.map(d=>d?`<button data-a="dir" data-v="${d[1]}" class="${normA(trace.dir)===d[1]?'on':''}" aria-label="Dirección ${d[1]}°">${d[0]}</button>`:`<span class="c">${f2(trace.dir).replace('.00','')}°</span>`).join('')}</div>
      <div class="dirside"><div class="row-btns"><button class="btn sm" data-a="turn" data-v="90">↶ 90°</button><button class="btn sm" data-a="turn" data-v="-90">↷ 90°</button></div>
      <label class="fld"><span>Ángulo exacto (°)</span><input id="tAng" inputmode="decimal" value="${f2(trace.dir)}" autocomplete="off"></label></div></div>
    <label class="fld"><span>Medida del muro (cara interior)</span></label>
    <div class="meas"><input id="meas" inputmode="decimal" placeholder="0.00" autocomplete="off" aria-label="Medida"><select id="mUnit" aria-label="Unidad">${['m','cm','mm'].map(u=>`<option ${trace.unit===u?'selected':''}>${u}</option>`).join('')}</select></div>
    <div class="grid2"><label class="fld"><span>Al terminar, girar</span><select id="tAuto"><option value="left" ${trace.auto==='left'?'selected':''}>90° a la izquierda</option><option value="right" ${trace.auto==='right'?'selected':''}>90° a la derecha</option><option value="none" ${trace.auto==='none'?'selected':''}>No girar</option></select></label>
    <label class="fld"><span>Espesor (m)</span><input id="tEsp" inputmode="decimal" value="${f2(trace.t)}"></label></div>
    <div class="row-btns"><button class="btn pri" data-a="addWall">Agregar muro ⏎</button><button class="btn" data-a="undoWall" ${s.walls.length?'':'disabled'}>Quitar último</button>${s.walls.length>=2?'<button class="btn acc" data-a="close">Cerrar espacio</button>':''}</div>
    <p class="hint">Recorre el espacio por dentro. Con un láser en modo teclado (HID), toca el campo de medida y dispara: el valor entra y el muro se agrega solo.</p>
  </div>`}
  <div class="sec"><h3>Muros</h3>${s.walls.length?`<div class="list">${s.walls.map((w,i)=>`<button class="row" data-a="selWall" data-v="${w.id}"><span class="code">M${i+1}</span><span>${f2(w.len)} m · ${dirName(w.ang)}${w.openings.length?' · '+w.openings.length+' vano'+(w.openings.length>1?'s':''):''}</span><span class="num">h ${f2(wh(w,s,'i'))}${wh(w,s,'i')!==wh(w,s,'f')?'→'+f2(wh(w,s,'f')):''}</span></button>`).join('')}</div>`:'<p class="hint">Sin muros todavía.</p>'}</div>
  <div class="sec"><h3>Datos del espacio</h3>
    ${F('Nombre','space','name',s.name,'text')}
    <div class="grid3">${F('Piso n.º','space','piso',s.piso,'int')}${F('NPT (m)','space','npt',s.npt)}${F('Altura libre','space','h',s.h)}</div>
    <div class="grid3">${F('X (m)','space','x',s.x)}${F('Y (m)','space','y',s.y)}${F('Giro (°)','space','rot',s.rot)}</div>
    <div class="grid2">${F('Piso acabado','space','pisoAcab',s.pisoAcab,'text')}${F('Cielo raso','space','cielo',s.cielo,'text')}</div>
    ${TA('Notas','space','notas',s.notas)}
  </div>
  <div class="sec"><h3>Cubierta</h3><button class="btn" data-a="roofSpace">Crear cubierta sobre este espacio</button><p class="hint">También puedes dibujarla con la herramienta Cubierta de la barra.</p></div>

let pendingDel=null;
function delConfirm(a,label){return pendingDel===a?`<div class="confirm">¿Seguro? No se puede deshacer fácilmente. <button class="btn dng" data-a="${a}">Sí, eliminar</button><button class="btn" data-a="cancelDel">No</button></div>`:`<button class="btn dng" data-a="askDel" data-v="${a}">${label}</button>`}
function dirName(a){a=normA(a);const m={0:'Este',90:'Norte',180:'Oeste',270:'Sur',45:'NE',135:'NO',225:'SO',315:'SE'};return m[a]||(f2(a)+'°')}
function inspWall(){
  const s=curSpace(),w=curWall(),i=s.walls.indexOf(w),g=geom(s),sg=g.segs[i],codes=opCodes();
  const hI=wh(w,s,'i'),hF=wh(w,s,'f');const area=sg.L*(hI+hF)/2,opA=w.openings.reduce((a,o)=>a+Math.max(0,Math.min(o.w,sg.L))*o.h,0);
  return `<div><span class="eyebrow">Muro M${i+1} · ${esc(s.name)}</span><h2>${f2(sg.L)} m hacia el ${dirName(w.ang).toLowerCase()}</h2></div>
  <div class="stats"><div><small>Área bruta</small><b>${f2(area)}</b></div><div><small>Vanos</small><b>${f2(opA)}</b></div><div><small>Área neta</small><b>${f2(area-opA)}</b></div></div>
  ${g.closed&&i===s.walls.length-1&&Math.abs(sg.L-w.len)>.005?`<p class="warn">Medido ${f2(w.len)} m; el cierre lo dibuja de ${f2(sg.L)} m.</p>`:''}

    <div class="grid2">${SL('Material','wall','mat',w.mat,MATS)}${SL('Estado','wall','estado',w.estado,ESTADOS)}</div>
    ${F('Acabado','wall','acab',w.acab,'text','placeholder="Pañete y pintura, enchape…"')}
  </div>
  <div class="sec"><h3>Puertas, ventanas y vanos</h3>
    ${w.openings.map(o=>`<div class="opcard"><header><span class="code">${codes[o.id]} · ${o.type}</span><button class="btn sm dng" data-a="delOp" data-v="${o.id}">Quitar</button></header>
      <div class="grid3">${F('Desde inicio','op:'+o.id,'off',o.off)}${F('Ancho','op:'+o.id,'w',o.w)}${F('Alto','op:'+o.id,'h',o.h)}</div>
      <div class="grid3">${F('Antepecho','op:'+o.id,'sill',o.sill)}${o.type==='puerta'?SL('Bisagra','op:'+o.id,'hinge',o.hinge,[['ini','Lado inicio'],['fin','Lado final']])+SL('Abre hacia','op:'+o.id,'swing',o.swing,[['int','Adentro'],['ext','Afuera']]):''}</div>
      ${F('Material / nota','op:'+o.id,'mat',o.mat,'text','placeholder="Madera, aluminio, reja…"')}</div>`).join('')}
    <div class="row-btns"><button class="btn" data-a="addOp" data-v="puerta">+ Puerta</button><button class="btn" data-a="addOp" data-v="ventana">+ Ventana</button><button class="btn" data-a="addOp" data-v="vano">+ Vano</button></div>
    <p class="hint">"Desde inicio" es la distancia desde la esquina donde empieza el muro (punto naranja al medir) hasta el borde del vano.</p>
  </div>
  <div class="sec row-btns"><button class="btn" data-a="selSpace" data-v="${s.id}">← Volver al espacio</button>${delConfirm('delWall','Eliminar muro')}</div>`;
}
function inspEl(){
  const e=curEl(),c=CAT[e.type]||CAT.mueble,pn=patNums();
  return `<div><span class="eyebrow">Elemento · piso ${e.piso||1}</span><h2>${esc(c.n)}${c.marker?' '+pn[e.id]:''}</h2></div>
  <div class="sec">
  ${SL('Tipo','el','type',e.type,Object.entries(CAT).map(([k,v])=>[k,v.n]))}

function zipStore(files){const enc=new TextEncoder(),parts=[],cen=[];let off=0;const d=new Date(),dd=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate(),tt=(d.getHours()<<11)|(d.getMinutes()<<5);
  files.forEach(f=>{const nm=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,tt,true);h.setUint16(12,dd,true);h.setUint32(14,crc,true);h.setUint32(18,sz,true);h.setUint32(22,sz,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),nm,f.data);const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,tt,true);c.setUint16(14,dd,true);c.setUint32(16,crc,true);c.setUint32(20,sz,true);c.setUint32(24,sz,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);cen.push(new Uint8Array(c.buffer),nm);off+=30+nm.length+sz});
  const cs=cen.reduce((a,b)=>a+b.length,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cen,new Uint8Array(e.buffer)],{type:'application/zip'})}
/* ----- PDF ----- */
function loadScript(src){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>ko(new Error('No se pudo cargar el generador de PDF. Revisa la conexión.'));document.head.appendChild(s)})}
const SCALES=[20,25,50,75,100,125,150,200,250,500,1000];
async function makePDF(){
  if(!window.jspdf)await loadScript('jspdf.umd.min.js');
  const {jsPDF}=window.jspdf;const fmtS=paper==='doble'?[431.8,279.4]:[279.4,215.9];
  const doc=new jsPDF({orientation:'landscape',unit:'mm',format:fmtS});const PW=fmtS[0],PH=fmtS[1],m=10,tbH=20;
  const sheets=[];const saveSel=sel;sel={t:'none'};
  const pisos=[...new Set(P.spaces.map(s=>s.piso))].sort((a,b)=>a-b);
  pisos.forEach(pi=>sheets.push({kind:'dl',dl:planDL(pi,{print:1}),title:'Planta piso '+pi}));
  [...new Set((P.roofs||[]).map(r=>r.piso||1))].sort((a,b)=>a-b).forEach(pi=>sheets.push({kind:'dl',dl:planDL(pi,{print:1,roofPlan:1}),title:'Planta de cubiertas'+(pisos.length>1?' · piso '+pi:'')}));
  const aw=PW-2*m,ah=PH-2*m-tbH-4;
  P.spaces.forEach(s=>{if(!s.walls.length)return;const tot=geom(s).segs.reduce((a,g)=>a+g.L+2.2,0);let rowW=Math.max(8,Math.sqrt(tot*9*aw/ah));sheets.push({kind:'dl',dl:elevDL(s,rowW).dl,title:'Alzados interiores · '+s.name})});
  sheets.push({kind:'cuadro',title:'Cuadros de áreas, cubiertas, vanos y patologías'});
  sel=saveSel;
  const total=sheets.length;
  sheets.forEach((sh,idx)=>{if(idx)doc.addPage(fmtS,'landscape');doc.setDrawColor(0);doc.setLineWidth(.5);doc.rect(m,m,PW-2*m,PH-2*m);
    let esc_='—';
    if(sh.kind==='dl'){const b=bboxDL(sh.dl),bw=b.x1-b.x0+.4,bh=b.y1-b.y0+.4;let S=SCALES.find(S=>bw*1000/S<=aw-6&&bh*1000/S<=ah-6)||1000;const k=1000/S;esc_='1:'+S;pdfDL(doc,sh.dl,{x0:b.x0-.2,y0:b.y0-.2,x1:b.x1+.2,y1:b.y1+.2},m+3,m+3,aw-6,ah-6,k)}
    else pdfCuadro(doc,m+6,m+10,PW-2*m-12,PH-2*m-tbH-14);
    titleBlock(doc,m,PH-m-tbH,PW-2*m,tbH,sh.title,esc_,idx+1,total);
  });
  return doc.output('blob');
}
const PCOL={ink:[27,35,40],ink2:[110,120,126],dim:[31,95,191],sel:[27,35,40],dash:[110,120,126],roof:[138,90,43],pat:[184,57,42],thin:[80,90,96],ghost:[200,200,200]};
const PFILL={wall:[160,168,172],el:[232,236,231],col:[40,45,50],elev:[244,246,242],bg:[255,255,255],patfill:[255,255,255]};
const PLW={ink:.35,thin:.18,dim:.13,sel:.35,dash:.18,roof:.25,pat:.3};
function pdfDL(doc,dl,bb,X,Y,Wd,Hd,k){
  const ox=X+(Wd-(bb.x1-bb.x0)*k)/2,oy=Y+(Hd-(bb.y1-bb.y0)*k)/2,px=x=>ox+(x-bb.x0)*k,py=y=>oy+(bb.y1-y)*k;
  const style=it=>{const c=PCOL[it.st]||PCOL.ink;doc.setDrawColor(...c);doc.setLineWidth(PLW[it.st]||.25);if(it.st==='dash'||it.st==='roof')doc.setLineDashPattern([1.2,.8],0);else doc.setLineDashPattern([],0);if(it.fill&&PFILL[it.fill])doc.setFillColor(...PFILL[it.fill])};
  const polyl=(pts,closed,st)=>{const p=pts.map(q=>[px(q[0]),py(q[1])]);const d=[];for(let i=1;i<p.length;i++)d.push([p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]]);if(d.length)doc.lines(d,p[0][0],p[0][1],[1,1],st,closed)};
  for(const it of dl){if(it.st==='ghost'||(it.ly==='X'))continue;
    if(it.k==='text'){if(!it.s)continue;const c=PCOL[it.st]||PCOL.ink;doc.setTextColor(...c);doc.setFont('helvetica',it.bold?'bold':'normal');doc.setFontSize(it.mm*2.835);const a=it.ang||0,dir=[Math.cos(a),-Math.sin(a)],up=[-Math.sin(a),-Math.cos(a)];const w=doc.getTextWidth(it.s);let x=px(it.p[0])+up[0]*(it.dy||0),y=py(it.p[1])+up[1]*(it.dy||0);if(it.al!=='l'){x-=dir[0]*w/2;y-=dir[1]*w/2}doc.text(it.s,x,y,{angle:deg(a)});continue}
    if(it.fill==='room'||it.fill==='selfill'){continue}
    style(it);const st=it.fill&&PFILL[it.fill]?(it.st?'FD':'F'):'S';
    if(it.k==='poly')polyl(it.pts,!!it.closed,st);
    else if(it.k==='line')doc.line(px(it.a[0]),py(it.a[1]),px(it.b[0]),py(it.b[1]));
    else if(it.k==='arc'){const n=24,pts=[];for(let i=0;i<=n;i++){const t=it.a0+(it.a1-it.a0)*i/n;pts.push([it.c[0]+Math.cos(t)*it.r,it.c[1]+Math.sin(t)*it.r])}polyl(pts,false,'S')}
    else if(it.k==='circle'){doc.circle(px(it.c[0]),py(it.c[1]),it.r*k,st)}
  }doc.setLineDashPattern([],0);doc.setTextColor(0)}
function titleBlock(doc,x,y,w,h,title,scale,n,tot){doc.setLineDashPattern([],0);doc.setDrawColor(0);doc.setLineWidth(.4);doc.rect(x,y,w,h);
  const cols=[[.3,'PROYECTO',P.name],[.22,'UBICACIÓN',[P.dir,P.mun].filter(Boolean).join(' · ')],[.2,'CONTENIDO',title],[.08,'ESCALA',scale],[.12,'FECHA',P.fecha||''],[.08,'HOJA',n+' / '+tot]];
  let cx=x;cols.forEach(([f,l,v],i)=>{const cw=w*f;if(i)doc.line(cx,y,cx,y+h);doc.setFont('helvetica','normal');doc.setFontSize(6.5);doc.setTextColor(110);doc.text(l,cx+2.5,y+4.5);doc.setTextColor(0);doc.setFont('helvetica',i===0?'bold':'normal');doc.setFontSize(i===0?11:9);const lines=doc.splitTextToSize(String(v||'—'),cw-5).slice(0,2);doc.text(lines,cx+2.5,y+10.5);cx+=cw});
  doc.setFontSize(6.5);doc.setTextColor(110);doc.text('Levantó: '+(P.levanto||'—')+' · Medidas en metros a cara interior de muro',x+2.5,y+h-2.2);doc.setTextColor(0)}
function pdfCuadro(doc,x,y,w,h){const {rows,ops,pats,roofs}=cuadroData();let cy=y;const lh=5.2;
  const table=(title,heads,widths,data)=>{if(cy>y+h-20){return}doc.setFont('helvetica','bold');doc.setFontSize(10);doc.text(title,x,cy);cy+=5;doc.setFontSize(7.5);let cx=x;heads.forEach((t,i)=>{doc.text(t,cx,cy);cx+=widths[i]*w});cy+=1.5;doc.setLineWidth(.3);doc.line(x,cy,x+w,cy);cy+=4;doc.setFont('helvetica','normal');
    data.forEach(r=>{if(cy>y+h)return;let cx=x;r.forEach((t,i)=>{doc.text(doc.splitTextToSize(String(t??''),widths[i]*w-2)[0]||'',cx,cy);cx+=widths[i]*w});cy+=lh});cy+=5};
  const T=k=>rows.reduce((a,r)=>a+r[k],0);
  table('CUADRO DE ÁREAS',['Piso','Espacio','Área m²','Perím. m','Altura m','Vol. m³','Muro neto m²','Piso acabado','Cubierta'],[.05,.2,.08,.08,.07,.08,.1,.16,.18],rows.map(r=>[r.piso,r.name,f2(r.area),f2(r.per),f2(r.h),f2(r.vol),f2(r.wn),r.acab,r.cub]).concat([['','TOTAL',f2(T('area')),f2(T('per')),'',f2(T('vol')),f2(T('wn')),'','']]));
  table('CUADRO DE PUERTAS, VENTANAS Y VANOS',['Código','Tipo','Espacio','Muro','Ancho','Alto','Antepecho','Material'],[.08,.1,.2,.07,.08,.08,.09,.3],ops.map(o=>[o.code,o.type,o.esp,o.muro,f2(o.w),f2(o.h),f2(o.sill),o.mat]));
  if(roofs.length)table('CUBIERTAS',['Código','Tipo','Piso','Pend. %','Ángulo','Área planta','Área inclinada','Alero','Cumbrera','Material'],[.07,.09,.05,.08,.07,.1,.11,.08,.09,.26],roofs.map(r=>[r.code,r.tipo,r.piso,f2(r.pend),f2(r.ang)+'°',f2(r.ap),f2(r.ai),f2(r.hA),f2(r.hC),r.mat]));
  if(pats.length)table('PATOLOGÍAS',['N.º','Tipo','Piso','Altura','Descripción'],[.05,.14,.06,.07,.68],pats.map(p=>[p.n,p.pat,p.piso,f2(p.z),p.nota]));
}

/* ============ arranque ============ */
function boot(){
  readCols();
  try{const raw=lsGet('lev.projects');if(raw)store.projects=JSON.parse(raw)||{}}catch(e){store.projects={}}
  store.current=lsGet('lev.current');
  if(!Object.keys(store.projects).length){const ex=makeExample();store.projects[ex.id]=ex;store.current=ex.id;saveLocal()}
  Object.values(store.projects).forEach(migrateRoofs);
  P=store.projects[store.current]||Object.values(store.projects).sort((a,b)=>(b.updated||0)-(a.updated||0))[0];store.current=P.id;
  renderAll();setMode('planta');
  new ResizeObserver(()=>{if(view.mode==='3d')req3();else if(view.mode!=='cuadro')draw2D()}).observe($('#stage'));
  const re=()=>{readCols();if(view.mode==='3d')build3D(false);else draw2D()};
  try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',re)}catch(e){}
  new MutationObserver(re).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();e.shiftKey?doRedo():doUndo()}});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(view.mode!=='3d'&&view.mode!=='cuadro')draw2D()});
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
}
boot();
