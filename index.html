<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Levantamientos</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Levantamientos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F8F9F6">
<script src="three.min.js"></script>
<script src="jspdf.umd.min.js"></script>
<script src="polygon-clipping.umd.min.js"></script>
<style>
/* Layout: mesa de dibujo — barra superior, lienzo de planta a la izquierda, inspector de campo a la derecha (abajo en pantallas angostas). */
:root{
  --paper:#EDF0EC; --panel:#F8F9F6; --panel2:#E6EAE5; --ink:#1B2328; --ink2:#56626A; --line:#C9D0CB;
  --grid:#DFE4DF; --grid2:#CFD6D0; --poche:#98A3A8; --room:#F7F8F4; --el:#E3E8E2; --elev:#E8ECE6;
  --dim:#1F5FBF; --accent:#D98200; --accentwash:rgba(217,130,0,.16); --danger:#B8392A; --ok:#2F7D4F; --roof:#8A5A2B; --roofF:#EAD9C4; --slabF:#CDD3CF;
  --f-ui:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --f-num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12171A; --panel:#192024; --panel2:#222A2F; --ink:#E4E9E6; --ink2:#9BA7AE; --line:#2F393F;
  --grid:#1A2125; --grid2:#253035; --poche:#5E6B73; --room:#161C1F; --el:#253036; --elev:#1E262A;
  --dim:#73A6F2; --accent:#F0A63A; --accentwash:rgba(240,166,58,.18); --danger:#E0705F; --ok:#6CC08C; --roof:#D49A62; --roofF:#4A3B2C; --slabF:#3A4448; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12171A; --panel:#192024; --panel2:#222A2F; --ink:#E4E9E6; --ink2:#9BA7AE; --line:#2F393F;
  --grid:#1A2125; --grid2:#253035; --poche:#5E6B73; --room:#161C1F; --el:#253036; --elev:#1E262A;
  --dim:#73A6F2; --accent:#F0A63A; --accentwash:rgba(240,166,58,.18); --danger:#E0705F; --ok:#6CC08C; --roof:#D49A62; --roofF:#4A3B2C; --slabF:#3A4448; color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}html{height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{height:100%;margin:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}input,textarea,select{-webkit-user-select:text;user-select:text}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
#app{height:100%;display:grid;grid-template-rows:auto 1fr}
.bar{display:flex;align-items:center;gap:12px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.projbtn{display:flex;flex-direction:column;align-items:flex-start;background:none;border:0;padding:2px 4px;cursor:pointer;min-width:0;max-width:260px;text-align:left}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.projbtn b{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tabs{display:flex;background:var(--panel2);border-radius:8px;padding:3px;gap:2px;margin-inline:auto}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:6px;cursor:pointer;font-weight:500;color:var(--ink2)}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.baract{display:flex;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap;min-height:38px}
.btn:hover{border-color:var(--ink2)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#1B1300}
.btn.on{background:var(--accentwash);border-color:var(--accent)}
.btn.dng{color:var(--danger)}
.btn.sm{padding:4px 9px;min-height:32px;font-size:14px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0}
#stage{position:relative;min-height:0;overflow:hidden;background:var(--paper)}
#cv,#cv3{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#cuadro{position:absolute;inset:0;overflow:auto;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
.tools{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 24px)}
.tools .btn{background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(6px)}
.tools select{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 8px;min-height:38px}
#hud{position:absolute;right:12px;top:10px;font:12px var(--f-num);color:var(--ink2);background:color-mix(in srgb,var(--panel) 85%,transparent);padding:3px 7px;border-radius:5px;pointer-events:none}
#msg3{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink2);padding:24px;text-align:center}
aside{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:14px 40px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.crumbs button{background:none;border:0;color:var(--dim);cursor:pointer;padding:2px 0;font-weight:500}
h2{font-size:21px;font-weight:700;margin:0;text-wrap:balance;line-height:1.15}
h3{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);margin:0;font-weight:600}
.sec{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld span{font-size:12px;color:var(--ink2)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:7px 8px;min-height:38px;width:100%;box-sizing:border-box;min-width:0}
.fld input[inputmode="decimal"]{font-family:var(--f-num)}
.fld textarea{min-height:64px;resize:vertical}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stats div{background:var(--panel);padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.stats small{font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.stats b{font:500 16px var(--f-num);font-variant-numeric:tabular-nums}
.warn{color:var(--danger);font-size:13px}
.okc{color:var(--ok);font-size:13px}
.trace{background:var(--panel2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.meas{display:flex;gap:8px;align-items:stretch}
.meas input{flex:1;min-width:0;font:500 28px var(--f-num);padding:6px 10px;border:2px solid var(--ink);border-radius:8px;background:var(--panel);text-align:right}
.meas select{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 6px}
.dirpad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,44px);gap:4px}
.dirpad button{border:1px solid var(--line);background:var(--panel);border-radius:7px;cursor:pointer;font-size:18px}
.dirpad button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dirpad .c{display:grid;place-items:center;font:500 13px var(--f-num);color:var(--ink2)}
.dirrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.dirside{display:flex;flex-direction:column;gap:6px;flex:1;min-width:120px}
.hint{font-size:12.5px;color:var(--ink2);line-height:1.4}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.list button.row{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;text-align:left;background:var(--panel);border:0;border-bottom:1px solid var(--line);padding:9px 10px;cursor:pointer}
.list button.row:last-child{border-bottom:0}
.list button.row:hover{background:var(--panel2)}
.list .code{font:500 13px var(--f-num);color:var(--dim)}
.list .num{font:13px var(--f-num);color:var(--ink2);font-variant-numeric:tabular-nums}
.opcard{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--paper)}
.opcard header{display:flex;justify-content:space-between;align-items:center}
.opcard .code{font:600 14px var(--f-num);color:var(--dim)}
.row-btns{display:flex;gap:6px;flex-wrap:wrap}
.elgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.elgrid button{text-align:left;font-size:14px}
.confirm{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px}
.overlay{position:fixed;inset:0;background:rgba(10,14,16,.45);display:flex;justify-content:flex-start;z-index:20}
.drawer{background:var(--panel);width:min(420px,100%);height:100%;overflow:auto;box-sizing:border-box;padding-block:max(18px,env(safe-area-inset-top,0px)) 30px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:14px}
.pop{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:58px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:12px;width:min(320px,calc(100vw - 24px));display:flex;flex-direction:column;gap:8px;z-index:15}
.pop .btn{text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.pop .btn small{font-weight:400;color:var(--ink2);font-size:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:8px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100vw - 32px)}
#toast.show{opacity:1}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:600;background:var(--panel2)}
td.n{font-family:var(--f-num);text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:600;border-top:2px solid var(--ink)}
.cuadro-in{max-width:1100px;display:flex;flex-direction:column;gap:22px}
.cuadro-in h2{font-size:24px}
.badge{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--accentwash);color:var(--ink)}
.sync{font-size:11.5px;color:var(--ink2);white-space:nowrap}
main.nopanel{grid-template-columns:minmax(0,1fr)}
main.nopanel aside{display:none}
.rail{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:10px;display:flex;flex-direction:column;gap:4px;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:5px;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.rail button{width:52px;height:46px;border:0;border-radius:9px;background:none;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-size:10.5px;letter-spacing:.02em}
.rail button svg{width:22px;height:22px}
.rail button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.rail hr{border:0;border-top:1px solid var(--line);margin:3px 4px;width:auto}
.elpal{position:absolute;left:calc(max(10px,env(safe-area-inset-left,0px)) + 72px);top:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;width:min(320px,calc(100% - 100px));z-index:6;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.elpal{grid-template-columns:1fr!important;width:min(400px,calc(100% - 100px))!important;max-height:calc(100% - 20px);overflow:auto}
.famtabs{display:flex;gap:4px;flex-wrap:wrap;padding-bottom:4px}
.famtabs button{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.famtabs button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.palgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.palgrid button{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;font-size:12px;line-height:1.15;padding:6px 4px;min-height:80px;border:1px solid var(--line);border-radius:8px;background:var(--paper);cursor:pointer;color:var(--ink)}
.palgrid button svg{color:var(--ink2)}
.palgrid button[aria-pressed="true"]{border-color:var(--accent);background:var(--accentwash)}
.palgrid button[aria-pressed="true"] svg{color:var(--ink)}
.elpal p{grid-column:1/-1;margin:2px 2px 4px;font-size:12px;color:var(--ink2)}
.chip{position:absolute;left:50%;transform:translateX(-50%);top:10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.12);max-width:calc(100% - 150px)}
.chip b{font-weight:600;white-space:nowrap}
.chip .num{font:13px var(--f-num);color:var(--ink2);white-space:nowrap}
.qedit{position:absolute;z-index:8;display:flex;gap:6px;align-items:center;background:var(--panel);border:2px solid var(--accent);border-radius:10px;padding:5px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.qedit input{width:96px;font:500 20px var(--f-num);border:1px solid var(--line);border-radius:7px;padding:4px 8px;background:var(--paper);text-align:right}
.qedit span{font:13px var(--f-num);color:var(--ink2)}
#hud{top:auto;bottom:60px}
@media (max-width:760px){
  .rail{flex-direction:row;flex-wrap:wrap;right:10px;max-width:calc(100% - 20px)}
  .rail button{width:46px;height:46px}
  .rail hr{display:none}
  .elpal{left:10px;top:120px}
  .chip{top:auto;bottom:62px;max-width:calc(100% - 20px)}
  body{overflow:auto}
  #app{height:auto;min-height:100%}
  main{grid-template-columns:1fr;grid-template-rows:58vh auto}
  aside{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .tabs{order:3;width:100%;margin:0}
  .tabs button{flex:1;padding:7px 4px}
  .sync{display:none}
}
[hidden]{display:none!important}
#cv{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ptab{position:absolute;right:0;top:50%;transform:translateY(-50%);z-index:6;width:30px;height:88px;border:1px solid var(--line);border-right:0;border-radius:12px 0 0 12px;background:var(--panel);color:var(--ink);font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:-3px 0 10px rgba(0,0,0,.08);cursor:pointer;padding:0}
.props{position:absolute;z-index:7;width:226px;max-width:calc(100% - 96px);max-height:calc(100% - 80px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:0 8px 22px rgba(0,0,0,.16);opacity:.55;transition:opacity .2s}
.props.on,.props:focus-within{opacity:1}
.props.ghost{opacity:.18;pointer-events:none}
.props .ph{display:flex;align-items:center;gap:4px;padding:3px 3px 3px 9px;background:var(--ink);color:var(--paper);cursor:grab;touch-action:none;border-radius:10px 10px 0 0;position:sticky;top:0;z-index:1;font-size:12.5px}
.props .ph b{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.props .ph .grip{opacity:.5;font-size:11px;letter-spacing:-2px}
.props .ph button{background:none;border:0;color:inherit;font-size:16px;width:28px;height:26px;cursor:pointer;border-radius:6px;padding:0}
.props .pb{padding:7px;display:grid;grid-template-columns:1fr 1fr;gap:5px 6px}
.props .pf{display:flex;flex-direction:column;gap:1px;font-size:10px;color:var(--ink2);min-width:0}
.props .pf.full{grid-column:1/-1}
.props .pl{display:flex;align-items:center;gap:3px;white-space:nowrap;overflow:hidden}
.props .pl svg{width:13px;height:13px;flex:none;color:var(--accent)}
.props .pf input{font:600 16px var(--f-num);height:33px;padding:2px 7px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink);width:100%;box-sizing:border-box;min-width:0}
.props .pf input::placeholder{color:var(--ink2);opacity:.55}
.props .pf input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accentwash)}
.props .info{grid-column:1/-1;font:11px var(--f-num);color:var(--ink2);line-height:1.35}
.props .info:empty{display:none}
.props .info .btn.sm{padding:2px 7px;min-height:0;font-size:11px}
.props .pa{display:flex;gap:4px;flex-wrap:wrap;padding:0 7px 7px}
.props .ib{width:32px;height:30px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.props .ib svg{width:17px;height:17px}
.props .ib.dng{color:var(--danger)}
.props .tb{padding:2px 8px;height:30px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);font-size:11.5px;cursor:pointer}
.props .seg{grid-column:1/-1;display:flex;gap:4px}
.props .seg button{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:2px;font-size:10px;display:flex;flex-direction:column;align-items:center;cursor:pointer;min-width:0}
.props .seg button svg{width:34px;height:26px}
.props .seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accentwash);font-weight:600}
.props .cap{grid-column:1/-1;font-size:10px;color:var(--ink2);margin-top:2px}
.props .chips{grid-column:1/-1;display:flex;gap:3px;flex-wrap:wrap}
.props .chips button{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;font:500 11.5px var(--f-num);height:27px;cursor:pointer;padding:0 2px}
.props .chips button.on{border-color:var(--accent);background:var(--accentwash);font-weight:700}
.radial{position:absolute;z-index:9;width:0;height:0}
.radial button{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10.5px;line-height:1.1;box-shadow:0 6px 18px rgba(0,0,0,.22);cursor:pointer;transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0;transition:transform .16s ease-out,opacity .12s;padding:0}
.radial.show button{transform:translate(var(--dx),var(--dy)) scale(1);opacity:1}
.radial button svg{width:22px;height:22px}
.radial button.hot{background:var(--accent);color:#fff;border-color:var(--accent)}
.radial button.dng{color:var(--danger)}
.radial button.dng.hot{background:var(--danger);color:#fff;border-color:var(--danger)}
.radial button.ctr{width:42px;height:42px;margin:-21px 0 0 -21px;font-size:20px}
.radial .rt{position:absolute;transform:translate(-50%,-150px);white-space:nowrap;background:var(--ink);color:var(--paper);font-size:12px;padding:4px 10px;border-radius:8px;opacity:0;transition:opacity .15s}
.radial.show .rt{opacity:.92}
#fotos{position:absolute;inset:0;overflow:auto;padding:20px 16px 30px max(16px,env(safe-area-inset-left,0px))}
.fhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.fhead h2{margin:2px 0 4px}.fhead .hint{max-width:560px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}

/* símbolos en planta; coordenadas locales, el respaldo está hacia +y */
const SYM={
  sofa(g,e,c){const hw=e.w/2,hd=e.d/2,arm=Math.min(.2,e.w*.14),bk=Math.min(.22,e.d*.26);g.R(-hw,hd-bk,hw,hd);g.R(-hw,-hd,-hw+arm,hd-bk);g.R(hw-arm,-hd,hw,hd-bk);const n=c.seats||1,sw=(e.w-2*arm)/n;for(let i=1;i<n;i++)g.L(-hw+arm+i*sw,-hd,-hw+arm+i*sw,hd-bk)},
  chair(g,e){const hw=e.w/2,hd=e.d/2;g.R(-hw,hd-.08,hw,hd)},
  dining(g,e,c){const hw=e.w/2,hd=e.d/2,cw=.42,cd=.38,gap=.06,n=c.seats||4;let ends=n>=6?1:(n===4?1:0),side=(n-2*ends)/2;if(n===4){ends=1;side=1}

      const o=16/view.scale;if(c.circ){e.w=e.d=Math.max(.05,r2(2*(Math.hypot(lx,ly)-o)))}else{e.w=Math.max(.05,r2(2*(Math.abs(lx)-o*.7)));e.d=Math.max(.05,r2(2*(Math.abs(ly)-o*.7)))}

function adjText(s,i,V){const n=V.length,closed=s.closed&&s.walls.length>=3;const out=[];[i-1,i].forEach(j=>{const a=closed?(j+n)%n:j,b=closed?(j+1)%n:j+1;if(a>=0&&b<n&&a!==b)out.push(f2(len(sub(V[b],V[a]))))});return out.join(' · ')}
function snapSpace(s,d){/* pega un vértice del espacio a vértices de otros espacios */const tol=SNAPPX/view.scale;const mine=vertsOf(s).map(p=>toW(s,p));let best=null,bd=tol;

function toolDown(p,pt){
  const t=view.tool;if(view.mode==='cortes')return null;
  if(view.mode==='alzados')return elevDown(p);
  if(t==='sel'||t==='foto'){const hp=hitPhotoMark(p);if(hp)return{kind:'tapphoto',id:hp.id,p0:p,o0:[hp.x,hp.y],moved:false,snap:snapshot()}}
  if(t==='foto')return{kind:'tapfoto',p0:p,moved:false,snap:snapshot()};
  if(t==='sel'){
    const h=hitHandle(p);
    if(h){if(h.k==='rot'||h.k==='size')return startDrag(h.k,p,{obj:curEl()});
      if(h.k==='vtx'){const s=curSpace();return startDrag('vtx',p,{obj:s,i:h.i,V0:vertsOf(s),fr:frameOf(s)})}
      if(h.k==='opA'||h.k==='opB')return startDrag(h.k,p,{obj:curOp(),s:curSpace(),w:curWall()})
      if((sel.t==='roof'||sel.t==='slab')&&['rv','re','rrot','rsx','rsy','psx','psy'].includes(h.k))return roofDragStart(h,p,sel.t==='slab'?curSlab():null)
      if(h.k==='strot'){const st=curStair();return startDrag('strot',p,{obj:st})}
      if(h.k==='sca'||h.k==='scb'){const c=curSection();return startDrag(h.k,p,{obj:c})}}
    if(sel.t==='roof'){const r=curRoof();if(r&&inPoly(p,roofOutline(r))){const d=roofDragStart({k:'roof'},p);d.reselect=true;return d}}
    if(sel.t==='slab'){const sl=curSlab();if(sl&&inPoly(p,sl.pts)){const d=roofDragStart({k:'roof'},p,sl);d.reselect=true;return d}}
    const dh=hitDim(p);if(dh)return{kind:'tapdim',dh,p0:p,moved:false};
    const hit=hitPlan(p);if(!hit)return null;
    return dragFor(hit,p);
  }
  if(t==='borrar')return eraseDown(p);
  if(t==='muro')return muroDown(p);
  if(t==='cub'){const d=roofToolDown(p);d.snap=d.snap||snapshot();return d}
  if(t==='losa'){if(sdraft||view.slabForm==='libre'){const sp=snapPt(p);return{kind:'spt',A:sp.p,p0:p,moved:false,snap:snapshot()}}const hs=hitSlab(p);if(hs){sel=hs;return roofDragStart({k:'roof'},p,curSlab())}return{kind:'newslab',A:snapPt(p).p,p0:p,moved:false,snap:snapshot()}}
  if(t==='esc'){const hs=hitStair(p);if(hs){sel=hs;const st=curStair();return startDrag('stairmv',p,{obj:st,o0:[st.x,st.y]})}return{kind:'newstair',A:snapPt(p).p,p0:p,moved:false,snap:snapshot()}}

  if(t==='el'||t==='pat'){const hit=hitPlan(p);if(hit&&hit.t==='el')return dragFor(hit,p);return placeEl(p,t==='pat'?'patologia':view.elType)}
  return null;
}
function dragFor(hit,p){

  if(hit.t==='space'){const s=P.spaces.find(x=>x.id===hit.sid);sel=hit;return startDrag('space',p,{obj:s,o0:[s.x,s.y],sel:hit})}
  return null;
}
function placeOp(p,type){const nw=nearestWall(p,26);if(!nw){toast('Toca sobre un muro para ponerla');return null}
  const snap=snapshot(),o=newOp(type,type==='puerta'?view.doorSub:type==='ventana'?view.winSub:null);o.off=r2(clamp(nw.al-o.w/2,0,Math.max(0,nw.sg.L-o.w)));nw.sg.w.openings.push(o);

/* ---- dibujar muros ---- */
function chainSpace(){const s=drawSid&&P.spaces.find(x=>x.id===drawSid);return s&&!s.closed?s:null}
function muroDown(p){
  let s=chainSpace();const near=30/view.scale;
  if(s&&s.walls.length){const e=toW(s,geom(s).end);if(len(sub(e,p))<near)return{kind:'muro',A:e,s,p0:p,snap:snapshot(),moved:false}}
  for(const z of P.spaces.filter(z=>z.piso===view.piso&&!z.closed&&z.walls.length)){const e=toW(z,geom(z).end);if(len(sub(e,p))<near){drawSid=z.id;return{kind:'muro',A:e,s:z,p0:p,snap:snapshot(),moved:false}}}
  if(s&&!s.walls.length){P.spaces=P.spaces.filter(x=>x!==s)}
  drawSid=null;const sp=snapPt(p);return{kind:'muro',A:sp.p,s:null,p0:p,snap:snapshot(),moved:false};
}
function muroMove(d,q){d.prev=snapSeg(d.A,q);const sg=d.prev;let t=f2(sg.L)+' m';if(!sg.vtx&&!sg.ortho)t+=' · '+f2(sg.ang).replace('.00','')+'°';
  if(d.s&&d.s.walls.length>=2&&len(sub(sg.B,toW(d.s,[0,0])))<.005)t+=' · cierra';live={p:q,t}}
function muroUp(d){const sg=d.prev;live=null;if(!sg||sg.L<.05){return false}
  let s=d.s;
  if(!s){const ex=P.spaces.filter(z=>z.piso===view.piso);s=newSpace('',r2(d.A[0]),r2(d.A[1]),view.piso,ex[0]?ex[0].npt:0);s.ref=view.wallRef||'int';P.spaces.push(s);drawSid=s.id}
  s.walls.push(newWall(sg.L,normA(sg.ang-(s.rot||0)),trace.t));trace.dir=normA(sg.ang-(s.rot||0)+90);
  if(s.walls.length>=3&&len(sub(sg.B,toW(s,[0,0])))<.01){if(!s.name)s.name=nextSpaceName();s.closed=true;drawSid=null;sel={t:'space',sid:s.id};toast(s.name+' cerrado · '+f2(geom(s).area)+' m²')}
  else sel={t:'space',sid:s.id};
  return true;
}
function endChain(){const s=chainSpace();if(s&&!s.walls.length)P.spaces=P.spaces.filter(x=>x!==s);drawSid=null;live=null}

function elevDown(p){const tol=12/view.scale;
  for(const b of curBlocks){if(b.k!=='op')continue;const x=p[0]-b.ox,y=p[1]-b.oy;if(x<b.a-tol||x>b.b+tol||y<b.v0-tol||y>b.v1+tol)continue;
    let edge='M';if(Math.abs(x-b.a)<tol)edge='L';else if(Math.abs(x-b.b)<tol)edge='R';else if(Math.abs(y-b.v1)<tol)edge='T';else if(Math.abs(y-b.v0)<tol&&b.v0>.02)edge='B';
    const s=P.spaces.find(z=>z.id===b.sid),w=s.walls.find(z=>z.id===b.wid),o=w.openings.find(z=>z.id===b.oid);sel={t:'op',sid:s.id,wid:w.id,oid:o.id};frozenElev=view.elevPos;
    return startDrag('eop',p,{obj:o,o0:{...o},edge,mir:b.mir,L:b.L})}
  for(const b of curBlocks){if(b.k!=='wall')continue;const s=P.spaces.find(z=>z.id===b.sid),w=s.walls.find(z=>z.id===b.wid);
    const tl=[b.ox,b.oy+b.h0],tr=[b.ox+b.L,b.oy+b.h1];const nearL=len(sub(p,tl))<tol*1.6,nearR=len(sub(p,tr))<tol*1.6;
    if(nearL||nearR){const left=nearL,key=(left!==b.mir)?'hIni':'hFin';sel={t:'wall',sid:s.id,wid:w.id};frozenElev=view.elevPos;return startDrag('eh',p,{obj:w,key,h0:left?b.h0:b.h1})}
    if(p[0]>=b.x0&&p[0]<=b.x1&&p[1]>=b.y0&&p[1]<=b.y1){sel={t:'wall',sid:s.id,wid:w.id};return{kind:'tapsel',p0:p,moved:false}}}
  return null;
}

  else if(sel.t==='slab'&&c==='del'){P.slabs=P.slabs.filter(x=>x.id!==sel.lid);sel={t:'proj'};toast('Losa eliminada. ↶ para deshacer')}

}

function fdb(){if(!FDBP)FDBP=new Promise((ok,ko)=>{try{const r=indexedDB.open('lev-fotos',1);r.onupgradeneeded=()=>r.result.createObjectStore('fotos');r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)}catch(e){ko(e)}});return FDBP}
async function fput(id,blob){FMEM[id]=blob;delete FURL[id];try{const db=await fdb();await new Promise((ok,ko)=>{const t=db.transaction('fotos','readwrite');t.objectStore('fotos').put(blob,id);t.oncomplete=ok;t.onerror=()=>ko(t.error)})}catch(e){toast('Ojo: aquí la foto no queda guardada de forma permanente. Usa Guardar.')}}
async function fget(id){if(FMEM[id])return FMEM[id];try{const db=await fdb();return await new Promise(ok=>{const r=db.transaction('fotos').objectStore('fotos').get(id);r.onsuccess=()=>{if(r.result)FMEM[id]=r.result;ok(r.result||null)};r.onerror=()=>ok(null)})}catch(e){return null}}
const blobToDataURL=b=>new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>ok(null);r.readAsDataURL(b)});
function dataURLToBlob(u){const i=u.indexOf(','),mime=(u.slice(0,i).match(/:(.*?);/)||[0,'image/jpeg'])[1],bin=atob(u.slice(i+1)),a=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)a[k]=bin.charCodeAt(k);return new Blob([a],{type:mime})}
async function furl(id){if(FURL[id])return FURL[id];const b=await fget(id);if(!b)return null;return FURL[id]=await blobToDataURL(b)}
function loadImg(src){return new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>ko(new Error('No se pudo abrir la foto'));i.src=src})}
async function shrinkPhoto(file){const u=await blobToDataURL(file),im=await loadImg(u),M=2048,k=Math.min(1,M/Math.max(im.naturalWidth,im.naturalHeight)),w=Math.round(im.naturalWidth*k),h=Math.round(im.naturalHeight*k);
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);const blob=await new Promise(ok=>c.toBlob(ok,'image/jpeg',.82));return{blob,w,h}}
const photosOf=p=>p.photos||(p.photos=[]);
const photoCode=ph=>'F'+(photosOf(P).indexOf(ph)+1);
async function withPhotos(p){const c=JSON.parse(JSON.stringify(p));for(const ph of c.photos||[]){const b=await fget(ph.id);if(b)ph.img=await blobToDataURL(b)}return c}
function takePhotos(p){for(const ph of p.photos||[]){if(ph.img){let b=null;try{b=dataURLToBlob(ph.img)}catch(e){}delete ph.img;if(b)fput(ph.id,b)}}}
async function fotosGC(){try{const keep=new Set();Object.values(store.projects).forEach(p=>(p.photos||[]).forEach(ph=>keep.add(ph.id)));const db=await fdb();const t=db.transaction('fotos','readwrite'),os=t.objectStore('fotos'),r=os.getAllKeys();r.onsuccess=()=>{(r.result||[]).forEach(k=>{if(!keep.has(k))os.delete(k)})}}catch(e){}}
setTimeout(()=>{try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}fotosGC()},6000);

/* ---- tomar o elegir la foto ---- */
let photoCtx=null;
function photoCtxAt(p){const s=P.spaces.find(z=>z.piso===view.piso&&geom(z).closed&&inPoly(toL(z,p),geom(z).P));return{x:r2(p[0]),y:r2(p[1]),piso:view.piso,sid:s?s.id:null}}
function askPhoto(ctx,camera){photoCtx=ctx||{piso:view.piso};const i=$('#photoIn');if(camera)i.setAttribute('capture','environment');else i.removeAttribute('capture');i.value='';i.click();$('#fpop').hidden=true}
function photoPop(cx,cy,ctx){const p=$('#fpop');photoCtx=ctx;p.hidden=false;const w=p.offsetWidth||250,h=p.offsetHeight||50;p.style.left=clamp(cx-w/2,8,innerWidth-w-8)+'px';p.style.top=clamp(cy+14,8,innerHeight-h-8)+'px'}
$('#fpop').addEventListener('click',e=>{const b=e.target.closest('[data-fp]');if(!b)return;if(b.dataset.fp==='x'){$('#fpop').hidden=true;return}askPhoto(photoCtx,b.dataset.fp==='cam')});
document.addEventListener('pointerdown',e=>{const p=$('#fpop');if(!p.hidden&&!p.contains(e.target))p.hidden=true},true);
$('#photoIn').onchange=async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;toast('Guardando la foto…');
  try{const {blob,w,h}=await shrinkPhoto(f),c=photoCtx||{piso:view.piso},id=uid(),sp=c.sid&&P.spaces.find(s=>s.id===c.sid);
    const base=sp?spName(sp):'Foto',n=photosOf(P).filter(x=>x.name.startsWith(base)).length;
    await fput(id,blob);pushUndo();photosOf(P).push({id,name:n?base+' '+(n+1):base,fecha:new Date().toISOString(),piso:c.piso||view.piso,x:c.x??null,y:c.y??null,sid:c.sid||null,w,h,anns:[],nota:''});saved();renderAll();openPhoto(id)}
  catch(err){toast(err&&err.message?err.message:'No se pudo abrir la foto')}};

/* ---- marcas de cámara en la planta ---- */
function hitPhotoMark(p){const L=photosOf(P).filter(ph=>ph.x!=null&&(ph.piso||1)===view.piso);for(let i=L.length-1;i>=0;i--)if(len(sub(p,[L[i].x,L[i].y]))*view.scale<17)return L[i];return null}
function photoMarkMove(d,q){const ph=photosOf(P).find(x=>x.id===d.id);if(ph){ph.x=r2(d.o0[0]+q[0]-d.p0[0]);ph.y=r2(d.o0[1]+q[1]-d.p0[1])}}
function drawPhotoMarks(c,tf){photosOf(P).forEach(ph=>{if(ph.x==null||(ph.piso||1)!==view.piso)return;const [x,y]=tf(ph.x,ph.y);
  c.beginPath();c.arc(x,y,13,0,Math.PI*2);c.fillStyle=COL.ink;c.fill();c.lineWidth=2;c.strokeStyle=COL.paper;c.stroke();
  c.fillStyle=COL.paper;c.fillRect(x-7,y-4,14,9);c.fillRect(x-3,y-6,6,3);c.beginPath();c.arc(x,y+.5,3,0,Math.PI*2);c.fillStyle=COL.ink;c.fill();
  c.font='600 11px '+(COL.num||'monospace');c.textAlign='center';c.textBaseline='top';c.lineWidth=3;c.strokeStyle=COL.paper;const t=photoCode(ph);c.strokeText(t,x,y+15);c.fillStyle=COL.ink;c.fillText(t,x,y+15)})}

/* ---- dibujo de medidas sobre la foto ---- */
const ANC='#F25C05';
const annLabel=a=>a.t?(a.t+(a.k==='dim'&&/^\d+([.,]\d+)?$/.test(a.t)?' m':'')):'';
function annBox(c,t,M,ang,fs,on,kind,id){c.save();c.translate(M[0],M[1]);c.rotate(ang);const px=Math.round(15*fs);c.font='700 '+px+'px "IBM Plex Mono",ui-monospace,monospace';const w=c.measureText(t).width+12*fs,h=px+10*fs;
  c.fillStyle=kind==='txt'?'#FFE45C':'#fff';c.strokeStyle=on?'#1F5FBF':ANC;c.lineWidth=(on?2.6:1.6)*fs;c.beginPath();if(c.roundRect)c.roundRect(-w/2,-h/2,w,h,5*fs);else c.rect(-w/2,-h/2,w,h);c.fill();c.stroke();
  c.fillStyle='#14181a';c.textAlign='center';c.textBaseline='middle';c.fillText(t,0,fs);c.restore();return{id,cx:M[0],cy:M[1],r:Math.max(w,h)/2+6}}
function drawAnns(c,anns,toS,fs,selId){const boxes=[];c.save();c.lineCap='round';c.lineJoin='round';
  for(const a of anns){const on=a.id===selId;
    if(a.k==='dim'){const A=toS(a.a),B=toS(a.b),dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,tk=9*fs,ux=dx/L,uy=dy/L,ar=9*fs;
      const path=()=>{c.beginPath();c.moveTo(A[0],A[1]);c.lineTo(B[0],B[1]);for(const Q of [A,B]){c.moveTo(Q[0]-nx*tk,Q[1]-ny*tk);c.lineTo(Q[0]+nx*tk,Q[1]+ny*tk)}
        c.moveTo(A[0]+ux*ar+nx*ar*.45,A[1]+uy*ar+ny*ar*.45);c.lineTo(A[0],A[1]);c.lineTo(A[0]+ux*ar-nx*ar*.45,A[1]+uy*ar-ny*ar*.45);
        c.moveTo(B[0]-ux*ar+nx*ar*.45,B[1]-uy*ar+ny*ar*.45);c.lineTo(B[0],B[1]);c.lineTo(B[0]-ux*ar-nx*ar*.45,B[1]-uy*ar-ny*ar*.45)};
      path();c.strokeStyle='rgba(255,255,255,.95)';c.lineWidth=5.5*fs;c.stroke();path();c.strokeStyle=on?'#1F5FBF':ANC;c.lineWidth=2.4*fs;c.stroke();
      let ang=Math.atan2(dy,dx);if(ang>Math.PI/2)ang-=Math.PI;if(ang<=-Math.PI/2)ang+=Math.PI;
      if(a.id!=='tmp')boxes.push(annBox(c,annLabel(a)||'…',[(A[0]+B[0])/2,(A[1]+B[1])/2],ang,fs,on,'dim',a.id));
      if(on){for(const Q of [A,B]){c.beginPath();c.arc(Q[0],Q[1],7*fs,0,Math.PI*2);c.fillStyle='#fff';c.fill();c.lineWidth=2*fs;c.strokeStyle='#1F5FBF';c.stroke()}}}
    else if(a.k==='txt')boxes.push(annBox(c,a.t||'…',toS(a.p),0,fs,on,'txt',a.id))}
  c.restore();return boxes}

/* ---- editor de la foto ---- */
const PE={id:null,tool:'cota',k:1,ox:0,oy:0,img:null,sel:null,drag:null,pinch:null,tmp:null,boxes:[]};
const pcv=$('#pcv'),PEp=new Map();
const curPh=()=>photosOf(P).find(x=>x.id===PE.id);
const peS=p=>[PE.ox+p[0]*PE.k,PE.oy+p[1]*PE.k],peI=(x,y)=>[(x-PE.ox)/PE.k,(y-PE.oy)/PE.k];
function openPhoto(id){const ph=photosOf(P).find(x=>x.id===id);if(!ph)return;PE.id=id;PE.sel=null;PE.img=null;PE.tmp=null;$('#fpop').hidden=true;$('#photoEd').hidden=false;$('#pedName').value=ph.name;$('#pedDelOk').hidden=true;pedBar();
  requestAnimationFrame(()=>{pedFit();pedDraw()});
  furl(id).then(u=>u?loadImg(u):null).then(im=>{if(PE.id!==id)return;if(!im){toast('No encuentro la imagen de esta foto en este iPad');return}PE.img=im;pedDraw()}).catch(()=>toast('No se pudo abrir la foto'))}
function closePhoto(){pinApply();$('#photoEd').hidden=true;PE.id=null;PE.img=null;renderAll()}
function pedFit(){const ph=curPh();if(!ph)return;const {w:W,h:H}=sizeCanvas(pcv);PE.k=Math.min(W/ph.w,H/ph.h)*.94;PE.ox=(W-ph.w*PE.k)/2;PE.oy=(H-ph.h*PE.k)/2}
function pedDraw(){if($('#photoEd').hidden)return;const ph=curPh();if(!ph)return;const {w:W,h:H,dpr}=sizeCanvas(pcv),c=pcv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.fillStyle='#15181a';c.fillRect(0,0,W,H);
  if(PE.img)c.drawImage(PE.img,PE.ox,PE.oy,ph.w*PE.k,ph.h*PE.k);else{c.strokeStyle='#555';c.strokeRect(PE.ox,PE.oy,ph.w*PE.k,ph.h*PE.k);c.fillStyle='#999';c.font='14px sans-serif';c.textAlign='center';c.fillText('Cargando la foto…',W/2,H/2)}
  PE.boxes=drawAnns(c,ph.anns.concat(PE.tmp?[PE.tmp]:[]),peS,1,PE.sel);
  const nd=ph.anns.filter(a=>a.k==='dim').length;$('#pedInfo').textContent=photoCode(ph)+' · '+nd+(nd===1?' medida':' medidas')}
function pedBar(){document.querySelectorAll('#photoEd [data-pt]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.pt===PE.tool)));
  $('#pedHint').textContent=PE.tool==='cota'?'Arrastra el lápiz de un extremo al otro y escribe la medida. Toca una medida para cambiarla; arrastra sus puntas para ajustarla.':PE.tool==='texto'?'Toca donde quieras poner una nota (material, estado, “enchape”, “sin pañete”…).':'Arrastra con el lápiz para mover la foto. Con dos dedos acercas o alejas.'}
function snapAx(A,B){const dx=B[0]-A[0],dy=B[1]-A[1],a=Math.atan2(dy,dx)*180/Math.PI,m=((a%90)+90)%90;if(m<3||m>87){const L=Math.hypot(dx,dy),r=Math.round(a/90)*90*Math.PI/180;return[A[0]+L*Math.cos(r),A[1]+L*Math.sin(r)]}return B}
pcv.addEventListener('pointerdown',e=>{try{pcv.setPointerCapture(e.pointerId)}catch(_){}PEp.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(!$('#pin').hidden)pinApply();
  const r=pcv.getBoundingClientRect(),sx=e.clientX-r.left,sy=e.clientY-r.top,ph=curPh();if(!ph)return;
  if(PEp.size>=2){const v=[...PEp.values()];PE.drag=null;PE.tmp=null;PE.pinch={d:Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1,k:PE.k,ox:PE.ox,oy:PE.oy,c:[(v[0].x+v[1].x)/2-r.left,(v[0].y+v[1].y)/2-r.top]};pedDraw();return}
  const act=e.pointerType!=='touch'||view.finger;
  if(act&&PE.tool!=='mover'){
    for(const a of ph.anns.slice().reverse())if(a.k==='dim')for(const key of ['a','b']){const S=peS(a[key]);if(Math.hypot(S[0]-sx,S[1]-sy)<(a.id===PE.sel?18:12)){PE.drag={kind:'end',a,key,pid:e.pointerId,snap:snapshot(),moved:false,x:sx,y:sy};PE.sel=a.id;pedDraw();return}}
    const hb=PE.boxes.slice().reverse().find(b=>Math.hypot(b.cx-sx,b.cy-sy)<b.r);
    if(hb){const a=ph.anns.find(x=>x.id===hb.id);if(a){PE.drag={kind:'ann',a,pid:e.pointerId,snap:snapshot(),moved:false,x:sx,y:sy,o:JSON.parse(JSON.stringify(a))};PE.sel=a.id;pedDraw();return}}
    if(PE.tool==='cota'){const I=peI(sx,sy);PE.tmp={id:'tmp',k:'dim',a:I,b:I.slice(),t:''};PE.drag={kind:'new',pid:e.pointerId,moved:false,x:sx,y:sy};PE.sel=null;pedDraw();return}
    if(PE.tool==='texto'){PE.drag={kind:'newtxt',pid:e.pointerId,moved:false,x:sx,y:sy};return}}
  PE.drag={kind:'pan',pid:e.pointerId,x:sx,y:sy,ox:PE.ox,oy:PE.oy,moved:false}});
pcv.addEventListener('pointermove',e=>{const pt=PEp.get(e.pointerId);if(!pt)return;pt.x=e.clientX;pt.y=e.clientY;const r=pcv.getBoundingClientRect();
  if(PE.pinch&&PEp.size>=2){const v=[...PEp.values()],a=[v[0].x-r.left,v[0].y-r.top],b=[v[1].x-r.left,v[1].y-r.top],d=Math.hypot(a[0]-b[0],a[1]-b[1]),cc=[(a[0]+b[0])/2,(a[1]+b[1])/2],q=PE.pinch,k=clamp(q.k*d/q.d,.03,30),ix=(q.c[0]-q.ox)/q.k,iy=(q.c[1]-q.oy)/q.k;PE.k=k;PE.ox=cc[0]-ix*k;PE.oy=cc[1]-iy*k;pedDraw();return}
  const d=PE.drag;if(!d||d.pid!==e.pointerId)return;const sx=e.clientX-r.left,sy=e.clientY-r.top;if(!d.moved&&Math.hypot(sx-d.x,sy-d.y)<4)return;d.moved=true;
  if(d.kind==='pan'){PE.ox=d.ox+sx-d.x;PE.oy=d.oy+sy-d.y}
  else if(d.kind==='new')PE.tmp.b=snapAx(PE.tmp.a,peI(sx,sy));
  else if(d.kind==='end')d.a[d.key]=snapAx(d.a[d.key==='a'?'b':'a'],peI(sx,sy));
  else if(d.kind==='ann'){const dx=(sx-d.x)/PE.k,dy=(sy-d.y)/PE.k;if(d.a.k==='dim'){d.a.a=[d.o.a[0]+dx,d.o.a[1]+dy];d.a.b=[d.o.b[0]+dx,d.o.b[1]+dy]}else d.a.p=[d.o.p[0]+dx,d.o.p[1]+dy]}
  pedDraw()});
function pedEnd(e){PEp.delete(e.pointerId);if(PEp.size<2)PE.pinch=null;const d=PE.drag;if(!d||d.pid!==e.pointerId)return;PE.drag=null;const ph=curPh();if(!ph)return;
  const r=pcv.getBoundingClientRect(),sx=e.clientX-r.left,sy=e.clientY-r.top;
  if(e.type==='pointercancel'){PE.tmp=null;if(d.snap&&d.moved){P=JSON.parse(d.snap);fixSel()}pedDraw();return}
  if(d.kind==='new'){const t=PE.tmp;PE.tmp=null;const A=peS(t.a),B=peS(t.b);if(Math.hypot(A[0]-B[0],A[1]-B[1])<14){pedDraw();toast('Arrastra el lápiz de un extremo al otro de lo que mediste');return}
    pushUndo();t.id=uid();curPh().anns.push(t);saved();PE.sel=t.id;pedDraw();pinOpen(t,true);return}
  if(d.kind==='newtxt'){if(d.moved){pedDraw();return}pushUndo();const t={id:uid(),k:'txt',p:peI(sx,sy),t:''};curPh().anns.push(t);saved();PE.sel=t.id;pedDraw();pinOpen(t,true);return}
  if(d.kind==='end'||d.kind==='ann'){if(d.moved){undoS.push(d.snap);if(undoS.length>60)undoS.shift();redoS=[];saved();pedDraw()}else if(d.kind==='ann')pinOpen(d.a,false);else pedDraw();return}
  if(d.kind==='pan'&&!d.moved){PE.sel=null;pedDraw()}}
pcv.addEventListener('pointerup',pedEnd);pcv.addEventListener('pointercancel',pedEnd);
pcv.addEventListener('wheel',e=>{e.preventDefault();const r=pcv.getBoundingClientRect(),cx=e.clientX-r.left,cy=e.clientY-r.top,ix=(cx-PE.ox)/PE.k,iy=(cy-PE.oy)/PE.k;PE.k=clamp(PE.k*Math.exp(-e.deltaY*.002),.03,30);PE.ox=cx-ix*PE.k;PE.oy=cy-iy*PE.k;pedDraw()},{passive:false});
/* casilla para escribir la medida con el lápiz */
let pinT=null,pinNew=false;
function pinOpen(a,isNew){pinT=a.id;pinNew=isNew;const pin=$('#pin'),inp=$('#pinIn');inp.value=a.t||'';inp.setAttribute('inputmode',a.k==='dim'?'decimal':'text');inp.placeholder=a.k==='dim'?'Medida, ej. 2.40':'Nota';
  const M=a.k==='dim'?peS([(a.a[0]+a.b[0])/2,(a.a[1]+a.b[1])/2]):peS(a.p);pin.hidden=false;const st=$('#pedStage').getBoundingClientRect(),pw=pin.offsetWidth||260;
  pin.style.left=clamp(M[0]-pw/2,8,st.width-pw-8)+'px';pin.style.top=clamp(M[1]+26,8,st.height-64)+'px';inp.focus();inp.select()}
function pinHide(){$('#pin').hidden=true;pinT=null;pedDraw()}
function pinApply(){if(!pinT||$('#pin').hidden){$('#pin').hidden=true;pinT=null;return}const ph=curPh(),a=ph&&ph.anns.find(x=>x.id===pinT);let v=$('#pinIn').value.trim();
  if(a){if(a.k==='dim')v=v.replace(/,/g,'.');if(!v&&pinNew&&a.k==='txt'){ph.anns=ph.anns.filter(x=>x!==a)}else if(v!==a.t){if(!pinNew)pushUndo();a.t=v}saved()}
  $('#pin').hidden=true;pinT=null;pedDraw()}
function pinDelete(){const ph=curPh(),a=ph&&ph.anns.find(x=>x.id===pinT);if(a){if(!pinNew)pushUndo();ph.anns=ph.anns.filter(x=>x!==a);saved()}PE.sel=null;$('#pin').hidden=true;pinT=null;pedDraw()}
$('#pinOk').onclick=pinApply;$('#pinDel').onclick=pinDelete;
$('#pinIn').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();pinApply()}if(e.key==='Escape'){e.preventDefault();pinHide()}});
$('#photoEd').addEventListener('click',async e=>{const b=e.target.closest('[data-pe],[data-pt]');if(!b)return;
  if(b.dataset.pt){PE.tool=b.dataset.pt;pedBar();return}
  const c=b.dataset.pe;
  if(c==='done'){closePhoto();return}
  if(c==='undo'){pinApply();doUndo();if(!curPh()){closePhoto();return}$('#pedName').value=curPh().name;pedDraw();return}
  if(c==='fit'){pedFit();pedDraw();return}
  if(c==='share'){pinApply();try{await saveFile(photoFileName(curPh()),await photoJPG(curPh()))}catch(err){toast(err&&err.message?err.message:'No se pudo guardar la imagen')}return}
  if(c==='del'){$('#pedDelOk').hidden=false;return}
  if(c==='delno'){$('#pedDelOk').hidden=true;return}
  if(c==='delyes'){pushUndo();P.photos=photosOf(P).filter(x=>x.id!==PE.id);saved();$('#photoEd').hidden=true;PE.id=null;renderAll();toast('Foto eliminada. ↶ para deshacer');return}});
$('#pedName').addEventListener('change',e=>{const ph=curPh(),v=e.target.value.trim();if(ph&&v&&v!==ph.name){pushUndo();ph.name=v;saved()}});
window.addEventListener('resize',()=>{if(!$('#photoEd').hidden){pedFit();pedDraw()}});
const photoFileName=ph=>(safeName()+'_'+photoCode(ph)+'_'+ph.name).replace(/[^\wáéíóúñÁÉÍÓÚÑ.-]+/g,'_')+'.jpg';
async function photoJPG(ph){const u=await furl(ph.id);if(!u)throw new Error('No encuentro la imagen de esta foto');const im=await loadImg(u),c=document.createElement('canvas');c.width=ph.w;c.height=ph.h;const g=c.getContext('2d');g.drawImage(im,0,0,ph.w,ph.h);
  drawAnns(g,ph.anns,p=>p,Math.max(1.3,Math.min(ph.w,ph.h)/650),null);return await new Promise(ok=>c.toBlob(ok,'image/jpeg',.9))}

/* ---- galería (pestaña Fotos) ---- */
function renderFotos(){const el=$('#fotos'),L=photosOf(P);

function pdfLab(doc,t,x,y,bg){if(!t)return;doc.setFont('helvetica','bold');doc.setFontSize(9);const w=doc.getTextWidth(t)+3,h=4.8;doc.setFillColor(...bg);doc.setDrawColor(242,92,5);doc.setLineWidth(.3);doc.setLineDashPattern([],0);doc.rect(x-w/2,y-h/2,w,h,'FD');doc.setTextColor(20,24,26);doc.text(t,x,y+1.3,{align:'center'});doc.setTextColor(0)}
function pdfFoto(doc,sh,X,Y,W,H){const ph=sh.ph,k=Math.min(W/ph.w,H/ph.h),iw=ph.w*k,ih=ph.h*k,ox=X+(W-iw)/2,oy=Y+(H-ih)/2;doc.addImage(sh.data,'JPEG',ox,oy,iw,ih);
  const T=p=>[ox+p[0]*k,oy+p[1]*k];doc.setLineDashPattern([],0);
  ph.anns.forEach(a=>{if(a.k==='dim'){const A=T(a.a),B=T(a.b),L=Math.hypot(B[0]-A[0],B[1]-A[1])||1,nx=-(B[1]-A[1])/L*1.5,ny=(B[0]-A[0])/L*1.5;
      [[255,255,255,1.1],[242,92,5,.45]].forEach(([r,g,b,lw])=>{doc.setDrawColor(r,g,b);doc.setLineWidth(lw);doc.line(A[0],A[1],B[0],B[1]);doc.line(A[0]-nx,A[1]-ny,A[0]+nx,A[1]+ny);doc.line(B[0]-nx,B[1]-ny,B[0]+nx,B[1]+ny)});
      pdfLab(doc,annLabel(a),(A[0]+B[0])/2,(A[1]+B[1])/2,[255,255,255])}
    else if(a.t){const p=T(a.p);pdfLab(doc,a.t,p[0],p[1],[255,228,92])}})}
async function photoSheets(){const out=[];for(const ph of photosOf(P)){const b=await fget(ph.id);if(!b)continue;const s=ph.sid&&P.spaces.find(x=>x.id===ph.sid);out.push({kind:'foto',ph,data:await blobToDataURL(b),title:'Foto '+photoCode(ph)+' · '+ph.name+(s&&!ph.name.startsWith(spName(s))?' ('+spName(s)+')':'')})}return out}

function resolveObj(o){if(o==='proj')return P;if(o==='space')return curSpace();if(o==='rf')return curRoof();if(o==='sl')return curSlab();if(o==='st')return curStair();if(o==='sec')return curSection();if(o.startsWith('lvl:'))return(P.levels||[]).find(l=>l.n===+o.slice(4));if(o.startsWith('redge:')){const r=curRoof();return r&&r.edges[+o.slice(6)]}if(o==='zone')return curZone();if(o==='wall')return curWall();if(o==='el')return curEl();if(o.startsWith('op:')){const w=curWall();return w&&w.openings.find(x=>x.id===o.slice(3))}return null}
insp.addEventListener('change',e=>fieldChange(e.target));
function fieldChange(el){
  if(el.id==='tAuto'){trace.auto=el.value;return}if(el.id==='mUnit'){trace.unit=el.value;return}
  if(el.id==='tEsp'){trace.t=Math.max(.01,num(el.value,.15));return}
  if(el.id==='tAng'){trace.dir=normA(num(el.value,0));renderInspector();buildDL();draw2D();return}
  if(el.dataset.o==='rfv'||el.dataset.o==='rfall'){const r=curRoof(),v=num(el.value,NaN);if(r&&!isNaN(v)){pushUndo();if(el.dataset.o==='rfall'){r.plana=false;r.edges.forEach(e=>{if(!e.g)e.p=v})}else if(el.dataset.k==='w')r.rx=Math.max(.3,r2(v/2));else r.ry=Math.max(.3,r2(v/2));saved();renderAll(true)}return}
  if(!el.dataset.o)return;const obj=resolveObj(el.dataset.o);if(!obj)return;const t=el.dataset.t,k=el.dataset.k;let v=el.value;
  if(t==='num'){if(v.trim()===''&&el.dataset.null)v=null;else{v=num(v,NaN);if(isNaN(v)){toast('Escribe un número, por ejemplo 2.45');renderInspector();return}}}
  if(t==='int'){v=Math.max(1,Math.round(num(v,1)))}
  if(k==='ang'||k==='rot')v=normA(v);
  if(['len','t','w','h','d'].includes(k)&&v!=null&&v<0)v=Math.abs(v);
  if(el.dataset.o.startsWith('op:')&&k==='off'){const sp=curSpace(),wl=curWall();if(sp&&wl){const sg=geom(sp).segs[sp.walls.indexOf(wl)];v=r2(v+sg.s0)}}
  pushUndo();obj[k]=v;
  if(el.dataset.o==='el'&&k==='type'){const c=CAT[v];Object.assign(obj,{w:c.w,d:c.d,h:c.h,z:c.z})}
  if(el.dataset.o==='space'&&k==='piso'){view.piso=v}
  if(el.dataset.o==='el'&&k==='piso'){view.piso=v}
  if(el.dataset.o==='rf'&&k==='piso'){view.piso=v}
  if((el.dataset.o==='sl'||el.dataset.o==='st')&&k==='piso'){ensureLevels(P);if(!P.levels.find(l=>l.n===v)){while(P.levels[P.levels.length-1].n<v)addLevel()}view.piso=v}
  if(el.dataset.o==='st'&&k==='n')obj.n=Math.max(2,v);
  if(el.dataset.o==='rf'&&k==='plana')obj.plana=v==='1';
  if(el.dataset.o.startsWith('redge:')&&k==='g'){obj.g=v==='1';if(!obj.g)obj.p=obj.p||30}
  if(el.dataset.o==='rf'&&k==='rot'&&obj.forma==='poligono'){obj.rot=0}
  saved();renderAll(true);
}
insp.addEventListener('keydown',e=>{if(e.target.id==='meas'&&e.key==='Enter'){e.preventDefault();addWallFromMeas()}});
function addWallFromMeas(){const inp=$('#meas');if(!inp)return;const raw=inp.value;let v=num(raw,NaN);if(isNaN(v)||v<=0){toast('Escribe la medida del muro');inp.focus();return}
  const u=/mm/i.test(raw)?'mm':/cm/i.test(raw)?'cm':trace.unit;v=v/(u==='mm'?1000:u==='cm'?100:1);
  const s=curSpace();pushUndo();s.walls.push(newWall(Math.round(v*1000)/1000,trace.dir,trace.t));
  if(trace.auto==='left')trace.dir=normA(trace.dir+90);else if(trace.auto==='right')trace.dir=normA(trace.dir-90);
  saved();renderAll();const g=geom(s);if(s.walls.length>=3&&g.gap<.06)toast('Volviste al punto inicial: toca "Cerrar espacio"');
  setTimeout(()=>{const m=$('#meas');if(m)m.focus()},30);
}
insp.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;act(b.dataset.a,b.dataset.v)});
function act(a,v){
  const s=curSpace();
  if(a!=='askDel'&&a!=='cancelDel')pendingDel=null;
  switch(a){
    case 'goProj':sel={t:'proj'};renderAll();break;
    case 'selSpace':{const sp=P.spaces.find(x=>x.id===v);sel={t:'space',sid:v};if(sp&&sp.piso!==view.piso){view.piso=sp.piso}if(sp&&!sp.closed){const g=geom(sp);if(sp.walls.length){const lw=sp.walls[sp.walls.length-1];trace.dir=normA(lw.ang+(trace.auto==='left'?90:trace.auto==='right'?-90:0))}}renderAll();break}
    case 'selWall':sel={t:'wall',sid:sel.sid,wid:v};renderAll();break;
    case 'addSpace':{pushUndo();let x=0;const ex=P.spaces.filter(z=>z.piso===view.piso);if(ex.length){let mx=-1e9;ex.forEach(z=>{geom(z).segs.forEach(sg=>[sg.oa,sg.ob].forEach(p=>{mx=Math.max(mx,toW(z,p)[0])}))});x=Math.round((mx+1)*100)/100;if(!isFinite(x))x=0}
      const npt=ex[0]?ex[0].npt:0;const sp=newSpace('',x,0,view.piso,npt);sp.ref=view.wallRef||'int';P.spaces.push(sp);sel={t:'space',sid:sp.id};trace.dir=0;saved();renderAll();if(view.mode==='planta'){view.cx=x+2;view.cy=1.5;draw2D()}setTimeout(()=>{const m=$('#meas');if(m)m.focus()},50);break}
    case 'dir':trace.dir=normA(+v);renderInspector();buildDL();draw2D();$('#meas')&&$('#meas').focus();break;
    case 'turn':trace.dir=normA(trace.dir+(+v));renderInspector();buildDL();draw2D();break;
    case 'addWall':addWallFromMeas();break;
    case 'undoWall':if(s.walls.length){pushUndo();const w=s.walls.pop();trace.dir=w.ang;saved();renderAll()}break;
    case 'close':{pushUndo();const g=geom(s);if(!s.name)s.name=nextSpaceName();if(g.gap>.3){const d=mul(g.end,-1);s.walls.push(newWall(Math.round(len(d)*1000)/1000,deg(Math.atan2(d[1],d[0])),trace.t))}s.closed=true;saved();renderAll();toast(g.gap>.3?'Se agregó un muro de cierre de '+f2(g.gap)+' m':'Espacio cerrado');break}
    case 'reopen':pushUndo();s.closed=false;const lw=s.walls[s.walls.length-1];if(lw)trace.dir=normA(lw.ang+90);saved();renderAll();break;
    case 'addOp':{const w=curWall();pushUndo();const o=newOp(v);const g=geom(s),sg=g.segs[s.walls.indexOf(w)];o.off=Math.max(0,Math.round((sg.L-o.w)/2*100)/100);w.openings.push(o);saved();renderAll();break}
    case 'delOp':{const w=curWall();pushUndo();w.openings=w.openings.filter(o=>o.id!==v);saved();renderAll();break}
    case 'askDel':pendingDel=v;renderInspector();break;
    case 'cancelDel':pendingDel=null;renderInspector();break;
    case 'delSpace':pushUndo();P.spaces=P.spaces.filter(x=>x.id!==s.id);pendingDel=null;sel={t:'proj'};saved();renderAll();toast('Espacio eliminado. Puedes deshacer con ↶');break;
    case 'delWall':{pushUndo();removeWalls(s,new Set([sel.wid]));pendingDel=null;sel={t:'proj'};saved();renderAll();break}
    case 'delZone':pushUndo();P.zones=(P.zones||[]).filter(z=>z.id!==sel.zid);pendingDel=null;sel={t:'proj'};saved();renderAll();break;
    case 'selZone':sel={t:'zone',zid:v};{const z=curZone();if(z&&(z.piso||1)!==view.piso)view.piso=z.piso||1}renderAll();break;
    case 'mkzone':startPick(s?s.walls.map(w=>w.id):[]);break;
    case 'zwalls':{const z=curZone();if(z)startPick(z.walls,z.id);break}
    case 'addLevel':{pushUndo();const n=addLevel();view.piso=n;saved();renderAll();toast(levelOf(n).name+' agregado a la cota +'+f2(levelOf(n).z));break}
    case 'delSlab':pushUndo();P.slabs=P.slabs.filter(x=>x.id!==sel.lid);pendingDel=null;sel={t:'proj'};saved();renderAll();break;
    case 'delStair':pushUndo();P.stairs=P.stairs.filter(x=>x.id!==sel.eid2);pendingDel=null;sel={t:'proj'};saved();renderAll();break;
    case 'delSection':pushUndo();P.sections=P.sections.filter(x=>x.id!==sel.cid);pendingDel=null;sel={t:'proj'};saved();renderAll();break;
    case 'secview':view.secView='sec:'+sel.cid;setMode('cortes');break;
    case 'slabHole':view.holeFor=sel.lid;sdraft={mode:'hole',pts:[]};view.tool='losa';renderRail();toast('Toca las esquinas del vacío; toca la primera para cerrar');renderAll();break;
    case 'slabHoleDel':{const sl=curSlab();if(sl&&sl.holes.length){pushUndo();sl.holes.pop();saved();renderAll()}break}
    case 'delRoof':pushUndo();P.roofs=(P.roofs||[]).filter(r=>r.id!==sel.rid);pendingDel=null;sel={t:'proj'};saved();renderAll();break;
    case 'roofSpace':{const r=roofOverSpace(s)||(curZone()&&roofOverZone(curZone()));if(!r){toast('Primero dibuja los muros del espacio');break}pushUndo();roofsOf(P).push(r);sel={t:'roof',rid:r.id};view.roofs=true;saved();renderAll();toast('Cubierta creada. Ajusta tipo y pendiente arriba.');break}
    case 'delEl':pushUndo();P.elements=P.elements.filter(e=>e.id!==sel.eid);pendingDel=null;sel={t:'proj'};saved();renderAll();break;
    case 'addEl':{pushUndo();const c=CAT[v];let x=view.cx,y=view.cy,piso=view.piso,z=c.z;if(s){const g=geom(s);const p=toW(s,g.cen);x=p[0];y=p[1];piso=s.piso;z=c.z+s.npt;if(v==='columna'||v==='colcirc'||v==='escalera')Object.assign(c,{})}
      const e={id:uid(),type:v,x:Math.round(x*100)/100,y:Math.round(y*100)/100,rot:0,piso,w:c.w,d:c.d,h:(v==='columna'||v==='colcirc')&&s?s.h:c.h,z,nota:'',pat:'Humedad'};P.elements.push(e);sel={t:'el',eid:e.id};view.piso=piso;saved();renderAll();toast(c.n+' agregado. Arrástralo con el lápiz.');break}
  }
}

function cuadroData(){
  const codes=opCodes(),rows=[],ops=[];
  P.spaces.forEach(s=>{const g=geom(s);let wb=0,wo=0;g.segs.forEach((sg,i)=>{const w=sg.w,hI=wh(w,s,'i'),hF=wh(w,s,'f');wb+=sg.L*(hI+hF)/2;w.openings.forEach(o=>{const ww=Math.max(0,Math.min(o.w,sg.L));wo+=ww*o.h;ops.push({code:codes[o.id],type:o.type==='vano'?'Vano':(o.type==='puerta'?'Puerta ':'Ventana ')+opSubName(o).toLowerCase(),esp:spName(s),piso:s.piso,muro:'M'+(i+1),w:ww,h:o.h,sill:o.sill,mat:o.mat||''})})});
    if(!g.closed)return;rows.push({piso:s.piso,name:spName(s),area:g.area,per:g.perim,h:s.h,vol:g.area*s.h,wb,wo,wn:wb-wo,closed:g.closed,acab:s.pisoAcab,cielo:s.cielo,cub:(()=>{const c=toW(s,g.cen),rc=roofCodes();return(P.roofs||[]).filter(r=>(r.piso||1)===s.piso&&inPoly(c,roofOutline(r))).map(r=>rc[r.id]+' '+roofType(r)+(r.mat?' · '+r.mat:'')).join(', ')})()})});
  (P.zones||[]).forEach(z=>{const g=zoneGeom(z);let wb=0,wo=0;g.refs.forEach(r=>{wb+=r.sg.L*(wh(r.w,r.s,'i')+wh(r.w,r.s,'f'))/2;r.w.openings.forEach(o=>{wo+=Math.max(0,Math.min(o.w,r.sg.L))*o.h})});
    const rc=roofCodes();rows.push({piso:z.piso||1,name:z.name,area:g.area,per:g.perim,h:z.h,vol:g.area*z.h,wb,wo,wn:wb-wo,closed:true,acab:z.pisoAcab,cielo:z.cielo,cub:(P.roofs||[]).filter(r=>(r.piso||1)===(z.piso||1)&&inPoly(g.cen,roofOutline(r))).map(r=>rc[r.id]+' '+roofType(r)).join(', ')})});
  const pn=patNums();const pats=P.elements.filter(e=>e.type==='patologia').map(e=>({n:pn[e.id],pat:e.pat,piso:e.piso||1,x:e.x,y:e.y,z:e.z,nota:e.nota}));
  const els=P.elements.filter(e=>e.type!=='patologia').map(e=>({n:(CAT[e.type]||CAT.mueble).n,piso:e.piso||1,w:e.w,d:e.d,h:e.h,z:e.z,nota:e.nota}));
  const rc=roofCodes(),roofs=(P.roofs||[]).map(r=>{const G=roofGeo(r),b=bboxPts(G.outline);return{code:rc[r.id],tipo:roofType(r),piso:r.piso||1,pend:roofPendT(r),ang:roofAngT(r),ap:G.ap,ai:G.ai,hA:r.hA,hC:G.top,w:b.x1-b.x0,d:b.y1-b.y0,mat:r.mat||'',nota:r.nota||''}});
  const sc=slabCodes(),slabs=(P.slabs||[]).map(s=>({code:sc[s.id],piso:levelOf(s.piso).name,area:slabArea(s),esp:s.esp,vol:slabArea(s)*s.esp,cota:LZ(s.piso)+s.z,mat:s.mat||''}));
  const ec=stairCodes(),stairs=(P.stairs||[]).map(s=>{const b=blondel(s);return{code:ec[s.id],piso:levelOf(s.piso).name,tipo:(STYPES.find(x=>x[0]===s.tipo)||['',''])[1],n:s.n,ch:b.ch,hu:s.huella,an:s.ancho,bl:b.v,ok:b.ok}});
  return{rows,ops,pats,els,roofs,slabs,stairs};
}

const safeName=()=>(P.name||'levantamiento').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w\-]+/g,'_').replace(/_+/g,'_').slice(0,60);
let pendingFile=null;
const MIME={pdf:'application/pdf',dxf:'application/dxf',csv:'text/csv',json:'application/json'};
async function saveFile(name,data){
  const ext=name.split('.').pop(),blob=data instanceof Blob?data:new Blob([data],{type:MIME[ext]||'application/octet-stream'});
  const file=new File([blob],name,{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]});toast('Listo: '+name);return}
    catch(e){if(e&&e.name==='AbortError'){toast('Cancelado');return}
      if(e&&e.name==='NotAllowedError'){pendingFile=file;showPending();return}}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},5000);toast('Archivo guardado: '+name);
}
function showPending(){const p=$('#pop');p.innerHTML=`<h3>Archivo listo</h3><p class="hint">${esc(pendingFile.name)}</p><button class="btn pri" id="pendBtn">Guardar en Archivos</button>`;p.hidden=false;
  $('#pendBtn').onclick=async()=>{const f=pendingFile;try{await navigator.share({files:[f]});toast('Listo: '+f.name)}catch(e){if(!e||e.name!=='AbortError')toast('No se pudo compartir el archivo')}pendingFile=null;p.hidden=true}}
function makeCSV(){const {rows,ops,pats,roofs,slabs,stairs}=cuadroData();const n=v=>fc(v),q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';let o='﻿'+q(P.name)+';'+q(P.dir)+';'+q(P.mun)+';'+q(P.fecha)+'\r\n\r\nCUADRO DE ÁREAS\r\nPiso;Espacio;Área m²;Perímetro m;Altura m;Volumen m³;Muro bruto m²;Vanos m²;Muro neto m²;Piso acabado;Cielo raso;Cubierta\r\n';
  rows.forEach(r=>o+=[r.piso,q(r.name),n(r.area),n(r.per),n(r.h),n(r.vol),n(r.wb),n(r.wo),n(r.wn),q(r.acab),q(r.cielo),q(r.cub)].join(';')+'\r\n');
  o+='\r\nCUADRO DE PUERTAS, VENTANAS Y VANOS\r\nCódigo;Tipo;Piso;Espacio;Muro;Ancho m;Alto m;Antepecho m;Material\r\n';ops.forEach(r=>o+=[r.code,r.type,r.piso,q(r.esp),r.muro,n(r.w),n(r.h),n(r.sill),q(r.mat)].join(';')+'\r\n');
  o+='\r\nLOSAS\r\nCódigo;Piso;Área m²;Espesor m;Volumen m³;Cota sup. m;Material\r\n';slabs.forEach(r=>o+=[r.code,q(r.piso),n(r.area),n(r.esp),n(r.vol),n(r.cota),q(r.mat)].join(';')+'\r\n');
  o+='\r\nESCALERAS\r\nCódigo;Piso;Tipo;Contrahuellas;Contrahuella m;Huella m;Ancho m;2c+h\r\n';stairs.forEach(r=>o+=[r.code,q(r.piso),r.tipo,r.n,n(r.ch),n(r.hu),n(r.an),n(r.bl)].join(';')+'\r\n');
  o+='\r\nCUBIERTAS\r\nCódigo;Tipo;Piso;Pendiente %;Ángulo °;Ancho m;Fondo m;Área planta m²;Área inclinada m²;Alero m;Cumbrera m;Material\r\n';roofs.forEach(r=>o+=[r.code,q(r.tipo),r.piso,q(r.pend),q(r.ang),n(r.w),n(r.d),n(r.ap),n(r.ai),n(r.hA),n(r.hC),q(r.mat)].join(';')+'\r\n');
  o+='\r\nPATOLOGÍAS\r\nN.º;Tipo;Piso;X;Y;Altura;Descripción\r\n';pats.forEach(r=>o+=[r.n,q(r.pat),r.piso,n(r.x),n(r.y),n(r.z),q(r.nota)].join(';')+'\r\n');return o}

/* ----- DXF R12 ----- */
const DXFL={MUROS:7,'MUROS-ACHURADO':8,VANOS:4,COTAS:5,TEXTOS:7,ESPACIOS:9,ELEMENTOS:3,MOBILIARIO:6,LOSAS:8,ESCALERAS:2,CORTES:1,CUBIERTA:30,PATOLOGIAS:1,ALZADOS:7};
function dxfTxt(s){return String(s).replace(/[^\x20-\x7e]/g,c=>'\\U+'+c.charCodeAt(0).toString(16).toUpperCase().padStart(4,'0'))}
function makeDXF(){
  const E=[],R=v=>(Math.round(v*10000)/10000).toString();const lay=it=>it.ly&&DXFL[it.ly]!=null?it.ly:'TEXTOS',TS=50/1000;
  const put=(dl,dx,dy)=>{const T=p=>[p[0]+dx,p[1]+dy];dl.forEach(it=>{const ly=lay(it);
    if(it.k==='poly'){if((it.fill==='wall'||it.fill==='cut')&&it.pts.length===4){const p=it.pts.map(T);E.push('0','SOLID','8','MUROS-ACHURADO','10',R(p[0][0]),'20',R(p[0][1]),'30','0','11',R(p[1][0]),'21',R(p[1][1]),'31','0','12',R(p[3][0]),'22',R(p[3][1]),'32','0','13',R(p[2][0]),'23',R(p[2][1]),'33','0')}
      if(it.st||!it.fill){E.push('0','POLYLINE','8',ly,'66','1','70',it.closed?'1':'0','10','0','20','0','30','0');if(['dash','roof','secd','slab'].includes(it.st))E.splice(E.length-8,0,'6','DASHED');it.pts.map(T).forEach(p=>E.push('0','VERTEX','8',ly,'10',R(p[0]),'20',R(p[1]),'30','0'));E.push('0','SEQEND','8',ly)}}
    else if(it.k==='line'){if(it.st==='ghost')return;const a=T(it.a),b=T(it.b);E.push('0','LINE','8',ly);if(['dash','roof','secd','slab'].includes(it.st))E.push('6','DASHED');E.push('10',R(a[0]),'20',R(a[1]),'30','0','11',R(b[0]),'21',R(b[1]),'31','0')}
    else if(it.k==='arc'){const c=T(it.c);E.push('0','ARC','8',ly,'10',R(c[0]),'20',R(c[1]),'30','0','40',R(it.r),'50',R(deg(it.a0)),'51',R(deg(it.a1)))}
    else if(it.k==='circle'){if(it.st==='sel'&&it.ly==='X')return;const c=T(it.c);E.push('0','CIRCLE','8',ly,'10',R(c[0]),'20',R(c[1]),'30','0','40',R(it.r))}
    else if(it.k==='text'&&it.s){const h=it.mm*TS,up=[-Math.sin(it.ang||0),Math.cos(it.ang||0)],p=T(add(it.p,mul(up,(it.dy||0)*TS)));E.push('0','TEXT','8',ly,'10',R(p[0]),'20',R(p[1]),'30','0','40',R(h),'1',dxfTxt(it.s),'50',R(deg(it.ang||0)));if(it.al!=='l')E.push('72','1','11',R(p[0]),'21',R(p[1]),'31','0')}
  })};
  const saveSel=sel;sel={t:'none'};
  let ox=0;const pisos=[...new Set(P.spaces.map(s=>s.piso))].sort((a,b)=>a-b);if(!pisos.length)pisos.push(1);let bottom=0;
  pisos.forEach(pi=>{const dl=planDL(pi,{print:1});const b=bboxDL(dl);const title=[];txt(title,[b.x0,b.y0-1.2],'PLANTA PISO '+pi+' · LEVANTAMIENTO',4,{al:'l',bold:1});put(dl.concat(title),ox-b.x0,-b.y0);ox+=(b.x1-b.x0)+5;bottom=Math.min(bottom,-1.5)});
  [...new Set((P.roofs||[]).map(r=>r.piso||1))].sort((a,b)=>a-b).forEach(pi=>{const dl=planDL(pi,{print:1,roofPlan:1});const b=bboxDL(dl);const title=[];txt(title,[b.x0,b.y0-1.2],'PLANTA DE CUBIERTAS PISO '+pi,4,{al:'l',bold:1});put(dl.concat(title),ox-b.x0,-b.y0);ox+=(b.x1-b.x0)+5});
  if(P.spaces.length)viewList().forEach(([k,n])=>{const dl=sectionDL(k);const b=bboxDL(dl);put(dl,ox-b.x0,-b.y0);ox+=(b.x1-b.x0)+6});
  let y=bottom-4;P.spaces.forEach(s=>{if(!s.walls.length)return;const e=elevDL(s,30);const b=bboxDL(e.dl);put(e.dl,-b.x0,y-b.y1);y-=(b.y1-b.y0)+3});
  sel=saveSel;
  const H=['0','SECTION','2','HEADER','9','$ACADVER','1','AC1009','9','$INSUNITS','70','6','9','$LTSCALE','40','0.5','0','ENDSEC',
    '0','SECTION','2','TABLES','0','TABLE','2','LTYPE','70','2',
    '0','LTYPE','2','CONTINUOUS','70','0','3','Continua','72','65','73','0','40','0.0',
    '0','LTYPE','2','DASHED','70','0','3','Trazos','72','65','73','2','40','0.75','49','0.5','49','-0.25','0','ENDTAB',
    '0','TABLE','2','LAYER','70',String(Object.keys(DXFL).length+1),'0','LAYER','2','0','70','0','62','7','6','CONTINUOUS'];
  Object.entries(DXFL).forEach(([n,c])=>H.push('0','LAYER','2',n,'70','0','62',String(c),'6','CONTINUOUS'));
  H.push('0','ENDTAB','0','TABLE','2','STYLE','70','1','0','STYLE','2','STANDARD','70','0','40','0','41','1','50','0','71','0','42','0.25','3','txt','4','','0','ENDTAB','0','ENDSEC','0','SECTION','2','ENTITIES');
  return H.concat(E,['0','ENDSEC','0','EOF']).join('\r\n')+'\r\n';
}
/* ----- ZIP sin compresión ----- */
const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRCT[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function zipStore(files){const enc=new TextEncoder(),parts=[],cen=[];let off=0;const d=new Date(),dd=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate(),tt=(d.getHours()<<11)|(d.getMinutes()<<5);
  files.forEach(f=>{const nm=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,tt,true);h.setUint16(12,dd,true);h.setUint32(14,crc,true);h.setUint32(18,sz,true);h.setUint32(22,sz,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),nm,f.data);const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,tt,true);c.setUint16(14,dd,true);c.setUint32(16,crc,true);c.setUint32(20,sz,true);c.setUint32(24,sz,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);cen.push(new Uint8Array(c.buffer),nm);off+=30+nm.length+sz});
  const cs=cen.reduce((a,b)=>a+b.length,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cen,new Uint8Array(e.buffer)],{type:'application/zip'})}
/* ----- PDF ----- */
function loadScript(src){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>ko(new Error('No se pudo cargar el generador de PDF. Revisa la conexión.'));document.head.appendChild(s)})}
const SCALES=[20,25,50,75,100,125,150,200,250,500,1000];
async function makePDF(){
  if(!window.jspdf)await loadScript('jspdf.umd.min.js');
  const {jsPDF}=window.jspdf;const fmtS=paper==='doble'?[431.8,279.4]:[279.4,215.9];
  const doc=new jsPDF({orientation:'landscape',unit:'mm',format:fmtS});const PW=fmtS[0],PH=fmtS[1],m=10,tbH=20;
  const sheets=[];const saveSel=sel;sel={t:'none'};
  const pisos=[...new Set(P.spaces.map(s=>s.piso))].sort((a,b)=>a-b);
  pisos.forEach(pi=>sheets.push({kind:'dl',dl:planDL(pi,{print:1}),title:'Planta piso '+pi}));
  [...new Set((P.roofs||[]).map(r=>r.piso||1))].sort((a,b)=>a-b).forEach(pi=>sheets.push({kind:'dl',dl:planDL(pi,{print:1,roofPlan:1}),title:'Planta de cubiertas'+(pisos.length>1?' · piso '+pi:'')}));
  const aw=PW-2*m,ah=PH-2*m-tbH-4;
  P.spaces.forEach(s=>{if(!s.walls.length)return;const tot=geom(s).segs.reduce((a,g)=>a+g.L+2.2,0);let rowW=Math.max(8,Math.sqrt(tot*9*aw/ah));sheets.push({kind:'dl',dl:elevDL(s,rowW).dl,title:'Alzados interiores · '+spName(s)})});
  if(P.spaces.length)viewList().forEach(([k,n])=>sheets.push({kind:'dl',dl:sectionDL(k),title:n}));
  sheets.push({kind:'cuadro',title:'Cuadros de áreas, cubiertas, vanos y patologías'});
  (await photoSheets()).forEach(x=>sheets.push(x));
  sel=saveSel;
  const total=sheets.length;
  sheets.forEach((sh,idx)=>{if(idx)doc.addPage(fmtS,'landscape');doc.setDrawColor(0);doc.setLineWidth(.5);doc.rect(m,m,PW-2*m,PH-2*m);
    let esc_='—';
    if(sh.kind==='dl'){const b=bboxDL(sh.dl),bw=b.x1-b.x0+.4,bh=b.y1-b.y0+.4;let S=SCALES.find(S=>bw*1000/S<=aw-6&&bh*1000/S<=ah-6)||1000;const k=1000/S;esc_='1:'+S;pdfDL(doc,sh.dl,{x0:b.x0-.2,y0:b.y0-.2,x1:b.x1+.2,y1:b.y1+.2},m+3,m+3,aw-6,ah-6,k)}
    else if(sh.kind==='foto')pdfFoto(doc,sh,m+3,m+3,aw-6,ah-6);else pdfCuadro(doc,m+6,m+10,PW-2*m-12,PH-2*m-tbH-14);
    titleBlock(doc,m,PH-m-tbH,PW-2*m,tbH,sh.title,esc_,idx+1,total);
  });
  return doc.output('blob');
}
const PCOL={cutl:[27,35,40],secl:[27,35,40],secd:[27,35,40],slab:[110,120,126],roofl:[138,90,43],ink:[27,35,40],ink2:[110,120,126],dim:[31,95,191],sel:[27,35,40],dash:[110,120,126],roof:[138,90,43],pat:[184,57,42],thin:[80,90,96],ghost:[200,200,200]};
const PFILL={cut:[120,128,132],roofF:[236,222,204],slabF:[208,213,209],wall:[160,168,172],el:[232,236,231],col:[40,45,50],elev:[244,246,242],bg:[255,255,255],patfill:[255,255,255]};
const PLW={cutl:.6,secl:.6,secd:.3,slab:.2,roofl:.18,ink:.35,thin:.18,dim:.13,sel:.35,dash:.18,roof:.25,pat:.3};
function pdfDL(doc,dl,bb,X,Y,Wd,Hd,k){
  const ox=X+(Wd-(bb.x1-bb.x0)*k)/2,oy=Y+(Hd-(bb.y1-bb.y0)*k)/2,px=x=>ox+(x-bb.x0)*k,py=y=>oy+(bb.y1-y)*k;
  const style=it=>{const c=PCOL[it.st]||PCOL.ink;doc.setDrawColor(...c);doc.setLineWidth(PLW[it.st]||.25);if(['dash','roof','secd','slab'].includes(it.st))doc.setLineDashPattern([1.2,.8],0);else doc.setLineDashPattern([],0);if(it.fill&&PFILL[it.fill])doc.setFillColor(...PFILL[it.fill])};
  const polyl=(pts,closed,st)=>{const p=pts.map(q=>[px(q[0]),py(q[1])]);const d=[];for(let i=1;i<p.length;i++)d.push([p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]]);if(d.length)doc.lines(d,p[0][0],p[0][1],[1,1],st,closed)};
  for(const it of dl){if(it.st==='ghost'||(it.ly==='X'))continue;
    if(it.k==='text'){if(!it.s)continue;const c=PCOL[it.st]||PCOL.ink;doc.setTextColor(...c);doc.setFont('helvetica',it.bold?'bold':'normal');doc.setFontSize(it.mm*2.835);const a=it.ang||0,dir=[Math.cos(a),-Math.sin(a)],up=[-Math.sin(a),-Math.cos(a)];const w=doc.getTextWidth(it.s);let x=px(it.p[0])+up[0]*(it.dy||0),y=py(it.p[1])+up[1]*(it.dy||0);if(it.al!=='l'){x-=dir[0]*w/2;y-=dir[1]*w/2}doc.text(it.s,x,y,{angle:deg(a)});continue}
    if(it.fill==='room'||it.fill==='selfill'){continue}
    style(it);const st=it.fill&&PFILL[it.fill]?(it.st?'FD':'F'):'S';
    if(it.k==='poly')polyl(it.pts,!!it.closed,st);
    else if(it.k==='line')doc.line(px(it.a[0]),py(it.a[1]),px(it.b[0]),py(it.b[1]));
    else if(it.k==='arc'){const n=24,pts=[];for(let i=0;i<=n;i++){const t=it.a0+(it.a1-it.a0)*i/n;pts.push([it.c[0]+Math.cos(t)*it.r,it.c[1]+Math.sin(t)*it.r])}polyl(pts,false,'S')}
    else if(it.k==='circle'){doc.circle(px(it.c[0]),py(it.c[1]),it.r*k,st)}
  }doc.setLineDashPattern([],0);doc.setTextColor(0)}
function titleBlock(doc,x,y,w,h,title,scale,n,tot){doc.setLineDashPattern([],0);doc.setDrawColor(0);doc.setLineWidth(.4);doc.rect(x,y,w,h);
  const cols=[[.3,'PROYECTO',P.name],[.22,'UBICACIÓN',[P.dir,P.mun].filter(Boolean).join(' · ')],[.2,'CONTENIDO',title],[.08,'ESCALA',scale],[.12,'FECHA',P.fecha||''],[.08,'HOJA',n+' / '+tot]];
  let cx=x;cols.forEach(([f,l,v],i)=>{const cw=w*f;if(i)doc.line(cx,y,cx,y+h);doc.setFont('helvetica','normal');doc.setFontSize(6.5);doc.setTextColor(110);doc.text(l,cx+2.5,y+4.5);doc.setTextColor(0);doc.setFont('helvetica',i===0?'bold':'normal');doc.setFontSize(i===0?11:9);const lines=doc.splitTextToSize(String(v||'—'),cw-5).slice(0,2);doc.text(lines,cx+2.5,y+10.5);cx+=cw});
  doc.setFontSize(6.5);doc.setTextColor(110);doc.text('Levantó: '+(P.levanto||'—')+' · Medidas en metros a cara interior de muro',x+2.5,y+h-2.2);doc.setTextColor(0)}
function pdfCuadro(doc,x,y,w,h){const {rows,ops,pats,roofs}=cuadroData();let cy=y;const lh=5.2;
  const table=(title,heads,widths,data)=>{if(cy>y+h-20){return}doc.setFont('helvetica','bold');doc.setFontSize(10);doc.text(title,x,cy);cy+=5;doc.setFontSize(7.5);let cx=x;heads.forEach((t,i)=>{doc.text(t,cx,cy);cx+=widths[i]*w});cy+=1.5;doc.setLineWidth(.3);doc.line(x,cy,x+w,cy);cy+=4;doc.setFont('helvetica','normal');
    data.forEach(r=>{if(cy>y+h)return;let cx=x;r.forEach((t,i)=>{doc.text(doc.splitTextToSize(String(t??''),widths[i]*w-2)[0]||'',cx,cy);cx+=widths[i]*w});cy+=lh});cy+=5};
  const T=k=>rows.reduce((a,r)=>a+r[k],0);
  table('CUADRO DE ÁREAS',['Piso','Espacio','Área m²','Perím. m','Altura m','Vol. m³','Muro neto m²','Piso acabado','Cubierta'],[.05,.2,.08,.08,.07,.08,.1,.16,.18],rows.map(r=>[r.piso,r.name,f2(r.area),f2(r.per),f2(r.h),f2(r.vol),f2(r.wn),r.acab,r.cub]).concat([['','TOTAL',f2(T('area')),f2(T('per')),'',f2(T('vol')),f2(T('wn')),'','']]));
  table('CUADRO DE PUERTAS, VENTANAS Y VANOS',['Código','Tipo','Espacio','Muro','Ancho','Alto','Antepecho','Material'],[.08,.1,.2,.07,.08,.08,.09,.3],ops.map(o=>[o.code,o.type,o.esp,o.muro,f2(o.w),f2(o.h),f2(o.sill),o.mat]));
  if(roofs.length)table('CUBIERTAS',['Código','Tipo','Piso','Pend. %','Ángulo','Área planta','Área inclinada','Alero','Cumbrera','Material'],[.07,.09,.05,.08,.07,.1,.11,.08,.09,.26],roofs.map(r=>[r.code,r.tipo,r.piso,r.pend,r.ang,f2(r.ap),f2(r.ai),f2(r.hA),f2(r.hC),r.mat]));
  if(pats.length)table('PATOLOGÍAS',['N.º','Tipo','Piso','Altura','Descripción'],[.05,.14,.06,.07,.68],pats.map(p=>[p.n,p.pat,p.piso,f2(p.z),p.nota]));
}

/* ============ arranque ============ */
function boot(){
  readCols();
  try{const raw=lsGet('lev.projects');if(raw)store.projects=JSON.parse(raw)||{}}catch(e){store.projects={}}
  store.current=lsGet('lev.current');
  if(!Object.keys(store.projects).length){const ex=makeExample();store.projects[ex.id]=ex;store.current=ex.id;saveLocal()}
  Object.values(store.projects).forEach(p=>{migrateRoofs(p);ensureLevels(p)});
  P=store.projects[store.current]||Object.values(store.projects).sort((a,b)=>(b.updated||0)-(a.updated||0))[0];store.current=P.id;
  renderAll();setMode('planta');
  new ResizeObserver(()=>{if(view.mode==='3d')req3();else if(view.mode!=='cuadro')draw2D()}).observe($('#stage'));
  const re=()=>{readCols();if(view.mode==='3d')build3D(false);else draw2D()};
  try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',re)}catch(e){}
  new MutationObserver(re).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveProject();return}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();e.shiftKey?doRedo():doUndo()}});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(view.mode!=='3d'&&view.mode!=='cuadro')draw2D()});
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
}
boot();
</script>
